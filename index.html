                    }
                    const sorted = [...list].sort((a, b) => {
                        const tsA = parseSafeDate(a.timestamp).getTime();
                        const tsB = parseSafeDate(b.timestamp).getTime();
                        if (tsA !== tsB && tsA > 0 && tsB > 0) return tsB - tsA;
                        return (b._rowOrder || 0) - (a._rowOrder || 0);
                    });
                    return sorted[0];

                return {
                    get: (nick) => {

                        // 0순위: 현재 방송(broadcastName) 전용으로 고객이 포털에서 변경했거나 이 방송 시트에 기록된 배송지 최우선 적용
                        const cleanCurB = String(broadcastName || '').replace(/^주문_/, '').trim();
                        if (cleanCurB && broadcastAddresses && broadcastAddresses[cleanCurB]) {
                            const bMap = broadcastAddresses[cleanCurB];
                            const bOverride = bMap[nick] || bMap[cleanNick];
                            if (bOverride && bOverride.address) {
                                return { data: bOverride, conflict: null, type: 'broadcast' };
                            }
                        }

                        // 1순위: 수동으로 연결(매칭)해 둔 닉네임
                        if (mappedTarget) {
                            const mClean = normalizeString(mappedTarget);
                            const mHandle = normalizeHandleNick(mappedTarget);
                            const mAddr = pickLatestAddr(exactNickMap[mClean], custPin) || pickLatestAddr(handleNickMap[mHandle], custPin);
                            if (mAddr) return { data: mAddr, conflict: null, type: mAddr._source || 'mapped' };
                        }

                        // 2순위: 전체 닉네임(홍당무1, 홍당무2, 홍당무-3k4 등) 100% 완전 일치
                        const exactList = exactNickMap[cleanNick] || [];
                        let matched = null;
                        if (exactList.length === 1) {
                            matched = exactList[0];
                        } else if (exactList.length > 1) {
                            const distinctPhones = new Set(exactList.map(x => fixPhoneNumber(x.phone)).filter(Boolean));
                            if (distinctPhones.size <= 1 || custPin) {
                                matched = pickLatestAddr(exactList, custPin);
                            }
                        }

                        // 3순위: 유튜브 핸들 꼬리표(-e4g 등)만 뗀 기본 닉네임 매칭 (단, 홍당무-3k4와 홍당무-5kj처럼 서로 다른 핸들 동명이인이 있을 때는 비밀번호가 일치할 때만 매칭!)
                        const orderHasExplicitHandle = /-[a-zA-Z0-9_]{1,10}$/.test(String(nick).trim());
                        if (!matched && handleNick && handleNick.length >= 2) {
                            const candidates = handleNickMap[handleNick] || [];
                            if (candidates.length > 0) {
                                if (custPin) {
                                    const byPin = candidates.filter(c => fixPhoneNumber(c.phone).slice(-4) === custPin);
                                    if (byPin.length === 1) matched = byPin[0];
                                } else {
                                    const distinctNicks = new Set(candidates.map(c => normalizeString(c.nickname)));
                                    const distinctPhones = new Set(candidates.map(c => fixPhoneNumber(c.phone)).filter(Boolean));
                                    if (distinctNicks.size === 1 && distinctPhones.size <= 1) {
                                        const candHasHandle = /-[a-zA-Z0-9_]{1,10}$/.test(String(candidates[0].nickname || '').trim());
                                        if (!(orderHasExplicitHandle && candHasHandle)) {
                                            matched = pickLatestAddr(candidates);
                                        }
                                    }
                                }
                            }
                        }

                        if (matched) {
                            return { data: matched, conflict: null, type: matched._source || 'master' };
                        }
                        return { data: null, conflict: null, type: 'none' };
                    }

        const parseRawDepositRowsToObjects = useCallback((depRowsInput) => {
            if (!Array.isArray(depRowsInput)) return [];
            // 빈 줄이나 헤더 줄을 먼저 깨끗하게 제거
            const nonEmptyRows = depRowsInput.filter(r => {
                if (!Array.isArray(r)) return false;
                const cells = r.filter(c => c !== null && c !== undefined && !/^__ROW_\d+__$/.test(String(c)) && String(c).trim() !== '');
                if (cells.length < 2) return false;
                const joined = cells.join(' ');
                if (joined.includes('입금자명') || (joined.includes('이름') && joined.includes('금액'))) return false;
                return true;
            });

            const contentKeyCountMap = {};
            const parsedList = nonEmptyRows.map((rawRow, idx) => {
                const row = [...rawRow];
                let rowNumTag = idx;
                if (row.length > 0 && /^__ROW_(\d+)__$/.test(String(row[row.length - 1] || ''))) {
                    const m = String(row.pop()).match(/^__ROW_(\d+)__$/);
                    if (m) rowNumTag = parseInt(m[1], 10);
                }
                const findAnyTimeInRow = (r, skipIdx) => {
                    for (let k = r.length - 1; k >= 0; k--) {
                        if (k === skipIdx) continue;
                        const s = String(r[k] ?? '').trim();
                        if (!s || s.startsWith('{')) continue;
                        if (/(\d{1,2}:\d{2})|(\d{4}[-./]\s*\d{1,2})|(GMT|오전|오후|AM|PM|T\d{2}:)/i.test(s)) return s;
                    }
                    return '';
                };
                if (row.length >= 6) {
                    const colE = String(row[4] ?? '').trim();
                    const rawColF = String(row[5] ?? '').trim();
                    const amtF = Number(rawColF.replace(/[^0-9.-]/g, ''));

            const handleDeletedCatalogIds = (snap) => {

                if (!delMap || typeof delMap !== 'object') return;
                const getSafeKey = (name) => String(name || '').replace(/[.#$\[\]]/g, '_');
                setInventory(prev => {
                    if (!Array.isArray(prev) || prev.length === 0) return prev;
                    const filtered = prev.filter(item => {
                        const sKey = getSafeKey(item.name);
                        if (delMap[sKey]) return false;
                        return !Object.keys(delMap).some(dk => sKey === dk || sKey.startsWith(dk + ' '));
                    });
                    return filtered.length !== prev.length ? filtered : prev;
                });
            };

            const applyIncomingBroadcastAddrs = (incomingList, targetBName) => {
                if (!Array.isArray(incomingList) || incomingList.length === 0 || !targetBName) return;
                addressSyncLock.current = Date.now();
                setBroadcastAddresses(prev => {
                    const curBMap = { ...(prev[targetBName] || {}) };
                    let bChanged = false;
                    incomingList.forEach(item => {
                        const fixedPh = fixPhoneNumber(item.phone || '');
                        const cNick = normalizeString(item.nickname);
                        const hNick = normalizeHandleNick(item.nickname);
                        const newEntry = {
                            nickname: item.nickname,
                            realname: item.realname || '',
                            phone: fixedPh,
                            address: item.address,
                            memo: item.memo || '',
                            timestamp: item.updatedAt || new Date().toISOString()
                        };
                        const prevEntry = curBMap[item.nickname] || curBMap[cNick];
                        if (!prevEntry || prevEntry.address !== newEntry.address || prevEntry.realname !== newEntry.realname || prevEntry.phone !== newEntry.phone || prevEntry.memo !== newEntry.memo) {
                            bChanged = true;
                            curBMap[item.nickname] = newEntry;
                            if (cNick) curBMap[cNick] = newEntry;
                            if (hNick) curBMap[hNick] = newEntry;
                        }
                    });
                    return bChanged ? { ...prev, [targetBName]: curBMap } : prev;
                });
            };

            const handlePortalBcastAddr = (snap) => {
                const val = snap.val();
                if (!val || typeof val !== 'object') return;
                const incoming = Object.values(val).filter(a => a && a.nickname && a.address);
                applyIncomingBroadcastAddrs(incoming, cleanActiveBName);
            };

            const handlePortalAddr = (snap) => {
                const val = snap.val();
                if (!val || typeof val !== 'object') return;
                // 현재 방송과 일치하는 배송지 변경 건만 현재 방송에 반영 (다른 방송 배송지는 건드리지 않음)
                const incoming = Object.values(val).filter(a => {
                    if (!a || !a.nickname || !a.address) return false;
                    if (!a.broadcastName || !cleanActiveBName) return true;
                    const aBName = String(a.broadcastName).replace(/^주문_/, '').trim();
                    return normalizeString(aBName) === normalizeString(cleanActiveBName);
                });
                if (incoming.length === 0) return;

                applyIncomingBroadcastAddrs(incoming, cleanActiveBName);

                setAddresses(prev => {
                    let changed = false;
                    const map = new Map();
                    prev.forEach((item, idx) => {
                        map.set(normalizeString(item.nickname), { ...item, _rowOrder: item._rowOrder ?? idx });
                    });
                    incoming.forEach((item, idx) => {
                        const k = normalizeString(item.nickname);
                        const existing = map.get(k);
                        // 찐고객사전에 아직 주소가 아예 없는 신규 첫구매 고객일 때만 기본 주소록에 추가
                        if (!existing) {
                            const fixedPh = fixPhoneNumber(item.phone || '');
                            changed = true;
                            map.set(k, {
                                nickname: item.nickname,
                                realname: item.realname || '',
                                phone: fixedPh,
                                address: item.address,
                                memo: item.memo || '',
                                timestamp: item.updatedAt || new Date().toISOString(),
                                _rowOrder: 50000 + idx,
                                _source: 'master'
                            });
                        }
                    });
                    return changed ? Array.from(map.values()) : prev;
                });

                // 만약 이전에 실수로 주소 연결 해제(__UNMAPPED__)가 되어 있던 고객이 직접 포털에서 새 주소를 입력했다면 자동으로 해제 상태를 풀어줌!
                setAddressMapping(prevMap => {
                    let mapChanged = false;
                    const nextMap = { ...prevMap };
                    incoming.forEach(item => {
                        const rawN = item.nickname;
                        const cleanN = normalizeString(rawN);
                        if (nextMap[rawN] === '__UNMAPPED__') { delete nextMap[rawN]; mapChanged = true; }
                        if (nextMap[cleanN] === '__UNMAPPED__') { delete nextMap[cleanN]; mapChanged = true; }
                    });
                    return mapChanged ? nextMap : prevMap;
                });
            };

            const handlePortalConf = (snap) => {
                const val = snap.val();
                if (!val || typeof val !== 'object') return;
                const confList = Object.values(val).filter(c => c && c.nickname);
                if (confList.length === 0) return;
                setCheckedOrders(prev => {
                    let changed = false;
                    const next = new Set(prev);
                    const now = Date.now();
                    confList.forEach(c => {
                        const n = c.nickname;
                        if (recentlyUncheckedRef.current[n] && (now - recentlyUncheckedRef.current[n] < 45000)) return;
                        if (!next.has(n)) {
                            next.add(n);
                            changed = true;
                        }
                    });
                    return changed ? next : prev;
                });
            };

            const handlePortalCred = (snap) => {
                const val = snap.val();
                if (!val || typeof val !== 'object') return;
                if (Date.now() - creditSyncLock.current < 5000) return;
                setCustomerCredits(prev => {
                    let changed = false;
                    const next = { ...prev };
                    Object.values(val).forEach(c => {
                        if (c && c.nickname && next[c.nickname] !== Number(c.credit)) {
                            next[c.nickname] = Number(c.credit) || 0;
                            changed = true;
                        }
                    });
                    return changed ? next : prev;
                });
            };

            const staffOrderRef = safeActiveBKey ? window.emberRealtimeDb.ref(`ember_live_data/_portal_orders/${safeActiveBKey}`) : null;

            const handleStaffOrderSync = (snap) => {
                const val = snap.val();
                if (!val || val.updatedBy !== 'staff' || !Array.isArray(val.customers)) return;
                if (!val.updatedAt || val.updatedAt <= lastStaffUpdateAtRef.current) return;
                lastStaffUpdateAtRef.current = val.updatedAt;
                staffSyncLockRef.current = Date.now();

                const nextOrders = [];
                const nextCards = {};
                const nextCash = {};
                const nextShip = {};
                const nextTrk = {};
                const nextPins = {};
                const nextLogs = {};
                const nextNoShow = {};
                const nextWait = {};
                const nextChecked = new Set();
                const nextBcastAddrs = {};

                val.customers.forEach((cust, cIdx) => {
                    const nick = String(cust.nickname || '').trim();
                    if (!nick) return;

                    if (cust.address && (cust.address.baseAddress || cust.address.realname)) {
                        const zipPrefix = cust.address.zipcode ? `(${cust.address.zipcode}) ` : '';
                        const fullAddr = `${zipPrefix}${cust.address.baseAddress || ''} ${cust.address.detailAddress || ''}`.trim();
                        const cleanPh = fixPhoneNumber(cust.address.phone || '');
                        if (fullAddr) {
                            const entry = {
                                nickname: nick,
                                realname: cust.address.realname || '',
                                phone: cleanPh,
                                address: fullAddr,
                                memo: cust.address.memo || ''
                            };
                            nextBcastAddrs[nick] = entry;
                            nextBcastAddrs[normalizeString(nick)] = entry;
                            const hKey = normalizeHandleNick(nick);
                            if (hKey) nextBcastAddrs[hKey] = entry;
                        }
                    }

                    const val = String(cust.isCard || '').trim();
                    if (val) {
                        const cardOnly = val.replace(/현영완료|현영요청|현영/g, '').trim();
                        if (cardOnly.includes('카드완료') || (cardOnly.includes('완료') && !val.includes('현영완료'))) nextCards[nick] = 'completed';
                        else if (cardOnly.startsWith('O') || cardOnly.includes('카드') || cust.isCard === true) nextCards[nick] = true;
                    }
                    if (cust.cashReceipt === 'completed' || val.includes('현영완료')) nextCash[nick] = 'completed';
                    else if (cust.cashReceipt === 'requested' || val.includes('현영')) nextCash[nick] = true;

                    if (cust.shipping !== undefined && cust.shipping !== null) {
                        nextShip[nick] = Number(cust.shipping) || 0;
                    }
                    if (cust.isNoShow) nextNoShow[nick] = true;
                    if (cust.isConfirmed) nextChecked.add(nick);
                    if (cust.phoneLast4) nextPins[nick] = String(cust.phoneLast4).trim();
                    if (Array.isArray(cust.trackingNumbers) && cust.trackingNumbers.length > 0 && cust.trackingNumbers[0]) {
                        nextTrk[nick] = String(cust.trackingNumbers[0]).trim();
                    }
                    if (Array.isArray(cust.deposits) && cust.deposits.length > 0) {
                        nextLogs[nick] = cust.deposits.map(d => ({
                            ...d,
                            fullTime: d.fullTime || d.time || ''
                        }));
                    }

                    const depTotal = Number(cust.depositTotal) || 0;
                    const cItems = Array.isArray(cust.items) ? cust.items : [];
                    cItems.forEach((it, idx) => {
                        if (it.isWaitlist) nextWait[nick] = true;
                        nextOrders.push({
                            id: Date.now() + (cIdx * 100) + idx + Math.random(),
                            customer: nick,
                            product: it.product || '',
                            quantity: Number(it.qty) || 1,
                            price: Number(it.price) || 0,
                            deposit: idx === 0 ? depTotal : 0,
                            isCancelled: false,
                            isUnmodified: false,
                            isWaitlist: Boolean(it.isWaitlist)
                        });
                    });
                });

                setOrders(nextOrders);
                setCardPayments(nextCards);
                setCashReceipts(prev => ({ ...prev, ...nextCash }));
                setShippingOverrides(nextShip);
                setNoShowCustomers(nextNoShow);
                setWaitlistCustomers(nextWait);
                setCheckedOrders(nextChecked);
                setCustomerPasswords(prev => ({ ...prev, ...nextPins }));
                setTrackingNumbers(prev => ({ ...prev, ...nextTrk }));
                setCustomerDepositLogs(prev => ({ ...prev, ...nextLogs }));
                if (cleanActiveBName && Object.keys(nextBcastAddrs).length > 0) {
                    setBroadcastAddresses(prev => ({
                        ...prev,
                        [cleanActiveBName]: { ...(prev[cleanActiveBName] || {}), ...nextBcastAddrs }
                    }));
                }
            };

            portalAddrRef.on('value', handlePortalAddr);
            if (portalBcastAddrRef) portalBcastAddrRef.on('value', handlePortalBcastAddr);
            portalConfRef.on('value', handlePortalConf);
            portalCredRef.on('value', handlePortalCred);
            catalogResetRef.on('value', handleCatalogReset);
            deletedCatalogIdsRef.on('value', handleDeletedCatalogIds);
            if (staffOrderRef) staffOrderRef.on('value', handleStaffOrderSync);
            return () => {
                portalAddrRef.off('value', handlePortalAddr);
                if (portalBcastAddrRef) portalBcastAddrRef.off('value', handlePortalBcastAddr);
                portalConfRef.off('value', handlePortalConf);
                portalCredRef.off('value', handlePortalCred);
                catalogResetRef.off('value', handleCatalogReset);
                deletedCatalogIdsRef.off('value', handleDeletedCatalogIds);
                if (staffOrderRef) staffOrderRef.off('value', handleStaffOrderSync);
            };
        }, [broadcastName, setAddresses, setBroadcastAddresses, setAddressMapping, setCheckedOrders, setCustomerCredits, setOrders, setCardPayments, setCashReceipts, setShippingOverrides, setNoShowCustomers, setWaitlistCustomers, setCustomerPasswords, setTrackingNumbers, setCustomerDepositLogs, setInventory]);

        useEffect(() => {
            let isCancelled = false;
            let ytTimer = null;
            const loopYoutube = async () => {
                if (isCancelled) return;
                await fetchYoutubeData();
                if (!isCancelled) {
                    ytTimer = setTimeout(loopYoutube, chatPollingIntervalRef.current || 4000);
                }
            };
            loopYoutube();
            return () => {
                isCancelled = true;
                if (ytTimer) clearTimeout(ytTimer);
            };
        }, [fetchYoutubeData]);

        const allDeposits = useMemo(() => {
            const combined = [...manualDeposits, ...serverDeposits];
            return combined.filter(d => d && !deletedDepositIds.has(d.id) && (!d.contentId || !deletedDepositIds.has(d.contentId)) && (!d.legacyId || !deletedDepositIds.has(d.legacyId)));
        }, [manualDeposits, serverDeposits, deletedDepositIds]);

        const masterRealnameMap = useMemo(() => {
            const map = {};
            addresses.forEach(a => {
                if (!a.nickname || !a.realname) return;
                const cleanN = normalizeString(a.nickname);
                const handleN = normalizeHandleNick(a.nickname);
                if (cleanN) map[cleanN] = a.realname;
                if (handleN) map[handleN] = a.realname;
            });
            return map;
        }, [addresses]);

        // 자동 입금 매칭 로직 (중복 입금 원천 차단 + 선입금 후주문 시 금액 확정 후 매칭 보장!)
        useEffect(() => {
            if (isViewingPastBroadcast && !isLiveBroadcasting) return;
            if (!allDeposits || allDeposits.length === 0 || !orders || orders.length === 0) return;

            const activeCustomerGroups = {};
            orders.forEach(o => {
                if (o.isCancelled) return;
                if (!activeCustomerGroups[o.customer]) activeCustomerGroups[o.customer] = [];
                activeCustomerGroups[o.customer].push(o);
            });

            // ✨ 핵심 방어: 아직 상품명을 적는 중이거나 단가(가격)가 0원인 빈 주문줄만 있는 고객에게는 선입금이 미리 달라붙어 꼬이지 않도록, 실제 상품 금액이 1원 이상 있는 고객만 자동 매칭 대상으로 삼음!
            const customerNicks = Object.keys(activeCustomerGroups).filter(nick => {
                const items = activeCustomerGroups[nick] || [];
                const activeItems = items.filter(i => !i.isCancelled && !i.isWaitlist);
                const totalProdPrice = activeItems.reduce((s, i) => s + (Number(i.price) > 0 ? Number(i.price) : 0), 0);
                return activeItems.length > 0 && totalProdPrice > 0;
            });
            if (customerNicks.length === 0) return;

            let matchedAny = false;
            const newMatchedSet = new Set(matchedDeposits);
            const newLinks = { ...depositLinks };
            const newLogs = { ...customerDepositLogs };
            const depositAdditions = {};

            // 이미 모든 고객들의 입금기록 장부(customerDepositLogs)에 들어있는 입금 지문(시간+이름+금액)을 수집하여, ID 형식이 바뀌었더라도 절대 2번 중복 매칭되지 않게 방어!
            const alreadyLoggedSignatures = new Set();
            Object.values(newLogs).forEach(logArr => {
                if (!Array.isArray(logArr)) return;
                logArr.forEach(item => {
                    if (!item) return;
                    if (item.id) alreadyLoggedSignatures.add(item.id);
                    if (item.contentId) alreadyLoggedSignatures.add(item.contentId);
                    if (item.legacyId) alreadyLoggedSignatures.add(item.legacyId);
                    const sig = `${item.fullTime || item.time || ''}_${normalizeString(item.name)}_${Number(item.amount)}`;
                    alreadyLoggedSignatures.add(sig);
                });
            });

            allDeposits.forEach(dep => {
                const rawDepName = String(dep.name || '').trim();
                if (!rawDepName || rawDepName === '시재') return;
                if (newMatchedSet.has(dep.id) || (dep.contentId && newMatchedSet.has(dep.contentId)) || (dep.legacyId && newMatchedSet.has(dep.legacyId))) return;
                if (ignoredAutoMatch.has(dep.id) || (dep.contentId && ignoredAutoMatch.has(dep.contentId)) || (dep.legacyId && ignoredAutoMatch.has(dep.legacyId))) return;
                if (archivedDepositIds.has(dep.id) || (dep.contentId && archivedDepositIds.has(dep.contentId)) || (dep.legacyId && archivedDepositIds.has(dep.legacyId))) return;

                const fullTimeStr = dep.fullTime || formatDepositFullDateTime(dep.rawTime || dep.time || dep.date || '') || dep.time || '';
                const depSig = `${fullTimeStr}_${normalizeString(rawDepName)}_${Number(dep.amount)}`;

                // 동일인이 같은 분(minute)에 진짜로 2번 입금한 게 아니라면(_1번째 입금인데 이미 장부에 있는 경우), ID가 달라도 중복 매칭 차단!
                if (dep.id.endsWith('_1') && alreadyLoggedSignatures.has(depSig)) {
                    newMatchedSet.add(dep.id);
                    return;
                }
                if (alreadyLoggedSignatures.has(dep.id) || (dep.contentId && alreadyLoggedSignatures.has(dep.contentId))) {
                    newMatchedSet.add(dep.id);
                    return;
                }

                const depClean = cleanForMatch(rawDepName);
                const depNorm = normalizeString(rawDepName);
                const depKo = extractKo(rawDepName);
                if (!depClean && !depNorm) return;

                const depTokens = extractDepositTokens(rawDepName);

                // 1순위: 정확 일치 + 괄호 분리 일치(`드리머(한재은)`, `이호정(밤송이야)`) + 닉네임&실명 합체형 일치(`윤슬HAE고다해`, `니가조아이연홍`) + 번호제거 일치(`조용주42번`)
                let matchedCands = customerNicks.filter(nick => {
                    const nickClean = cleanForMatch(nick);
                    const nickNorm = normalizeString(nick);
                    const nickHandle = normalizeHandleNick(nick);
                    const nickKo = extractKo(nickHandle || nick);
                    const customDepRaw = depositorNames[nick] || '';
                    const customDep = customDepRaw ? normalizeString(customDepRaw) : '';
                    const customDepKo = customDepRaw ? extractKo(customDepRaw) : '';
                    const addrReal = addressLookup.get(nick)?.data?.realname || masterRealnameMap[nickNorm] || masterRealnameMap[nickHandle] || '';
                    const addrRealNorm = normalizeString(addrReal);
                    const addrRealClean = cleanForMatch(addrReal);
                    const addrRealKo = extractKo(addrReal);

                    // (A) 기존 전체 문자열 일치
                    if (depNorm && (depNorm === nickNorm || depNorm === nickHandle || (customDep && depNorm === customDep) || (addrRealNorm && depNorm === addrRealNorm))) {
                        return true;
                    }
                    if (depClean && (depClean === nickClean || (addrRealClean && depClean === addrRealClean))) {
                        return true;
                    }

                    // (B) 괄호나 기호로 분리된 조각(`드리머`, `한재은`, `조용주` 등) 중 하나가 닉네임이나 실명과 정확히 일치하는 경우!
                    // 예: "드리머(한재은)" -> 조각 "드리머"(드리머S2의 cleanForMatch인 '드리머'와 일치!) 또는 조각 "한재은"(실명과 일치!)
                    for (const tNorm of depTokens.norms) {
                        if (tNorm === nickNorm || tNorm === nickHandle || (customDep && tNorm === customDep) || (addrRealNorm && tNorm === addrRealNorm)) {
                            return true;
                        }
                    }
                    for (const tClean of depTokens.cleans) {
                        if ((nickClean && nickClean.length >= 2 && tClean === nickClean) || (addrRealClean && addrRealClean.length >= 2 && tClean === addrRealClean)) {
                            return true;
                        }
                    }

                    // (C) "윤슬HAE고다해", "니가조아이연홍", "애플진유니" 처럼 [닉네임 + 실명] 또는 [실명 + 닉네임]을 붙여 쓴 경우!
                    const realTargetNorm = addrRealNorm || customDep;
                    const realTargetKo = addrRealKo || customDepKo;
                    if (realTargetNorm && realTargetNorm.length >= 2) {
                        const combo1 = nickNorm + realTargetNorm;
                        const combo2 = realTargetNorm + nickNorm;
                        const combo3 = nickHandle + realTargetNorm;
                        const combo4 = realTargetNorm + nickHandle;
                        const combo5 = nickClean + realTargetNorm;
                        const combo6 = realTargetNorm + nickClean;
                        if ([combo1, combo2, combo3, combo4, combo5, combo6].includes(depTokens.fullNorm) || [combo1, combo2, combo3, combo4, combo5, combo6].includes(depNorm)) {
                            return true;
                        }
                        // 입금자명 안에 닉네임(2글자 이상)과 실명(2글자 이상)이 둘 다 포함되어 있는 경우
                        if (nickHandle.length >= 2 && depTokens.fullNorm.includes(nickHandle) && depTokens.fullNorm.includes(realTargetNorm)) {
                            return true;
                        }
                        if (nickKo.length >= 2 && realTargetKo.length >= 2 && depTokens.fullKo.includes(nickKo) && depTokens.fullKo.includes(realTargetKo)) {
                            return true;
                        }
                    }

                    return false;
                });

                // 2순위: 입금자명(또는 괄호 안 조각)의 한글 부분이 주문자 실명이나 닉네임 한글 부분(2글자 이상)과 일치하거나,
                // "니가조아이연홍"처럼 입금자명이 주문자 닉네임(3글자 이상)으로 시작/끝나는 유일한 1명일 때 매칭!
                if (matchedCands.length === 0 && (depKo.length >= 2 || depTokens.kos.length > 0)) {
                    const koCands = customerNicks.filter(nick => {
                        const nickNorm = normalizeString(nick);
                        const nickHandle = normalizeHandleNick(nick);
                        const customDepKo = depositorNames[nick] ? extractKo(depositorNames[nick]) : '';
                        const addrReal = addressLookup.get(nick)?.data?.realname || masterRealnameMap[nickNorm] || masterRealnameMap[nickHandle] || '';
                        const addrRealKo = extractKo(addrReal);
                        const nickKo = extractKo(nickHandle || nick);

                        // 괄호 등으로 쪼개진 한글 토큰("드리머", "한재은", "유찬희", "밤송이야", "조용주")과 일치 확인
                        for (const tk of depTokens.kos) {
                            if (tk.length >= 2) {
                                if ((customDepKo && customDepKo === tk) || (addrRealKo && addrRealKo === tk) || (nickKo && nickKo.length >= 2 && nickKo === tk)) {
                                    return true;
                                }
                            }
                        }

                        // 주소록에 아직 실명이 안 적혀있더라도 "니가조아이연홍"처럼 주문자 닉네임(3글자 이상, 예: "니가조아", "윤슬hae")으로 시작하거나 끝나는 경우!
                        if (nickHandle.length >= 3 && (depTokens.fullNorm.startsWith(nickHandle) || depTokens.fullNorm.endsWith(nickHandle))) {
                            return true;
                        }
                        if (nickKo.length >= 3 && (depTokens.fullKo.startsWith(nickKo) || depTokens.fullKo.endsWith(nickKo))) {
                            return true;
                        }
                        // 반대로 주문서 닉네임이 "애플진유니"이고 입금자명이 "애플진유니"의 뒷부분/앞부분 실명과 결합된 경우
                        if (addrRealKo && addrRealKo.length >= 2 && depTokens.fullKo.length >= 3 && (depTokens.fullKo.endsWith(addrRealKo) || depTokens.fullKo.startsWith(addrRealKo))) {
                            return true;
                        }

                        return false;
                    });
                    if (koCands.length === 1) {
                        matchedCands = koCands;
                    } else if (koCands.length > 1) {
                        // 여러 명일 경우 아래 금액 대조 로직에서 미납액이 정확히 일치하는 1명을 찾도록 넘김
                        matchedCands = koCands;
                    }
                }

                // 후보 고객 중 아직 미납금이 남아 있는 고객을 우선 선택하고, 동명이인이 여러 명일 때는 미납 금액이 입금액과 일치하는 고객에게 매칭!
                let matchedNick = null;
                const getCustomerUnpaidBalance = (nick) => {
                    const items = activeCustomerGroups[nick] || [];
                    const activeItems = items.filter(i => !i.isCancelled && !i.isWaitlist);
                    const prodSum = activeItems.reduce((s, i) => s + Number(i.price), 0);
                    const prodSumForShip = activeItems.reduce((s, i) => s + (Number(i.price) > 0 ? Number(i.price) : 0), 0);
                    const ship = getCalculatedShipping(nick, prodSumForShip);
                    const curDep = items.reduce((s, i) => s + (i.deposit || 0), 0) + (depositAdditions[nick] || 0);
                    return (prodSum + (activeItems.length > 0 ? ship : 0)) - curDep;
                };

                if (matchedCands.length === 1) {
                    matchedNick = matchedCands[0];
                } else if (matchedCands.length > 1) {
                    const exactAmountMatches = matchedCands.filter(nick => getCustomerUnpaidBalance(nick) === Number(dep.amount));
                    if (exactAmountMatches.length === 1) {
                        matchedNick = exactAmountMatches[0];
                    } else {
                        const unpaidMatches = matchedCands.filter(nick => getCustomerUnpaidBalance(nick) > 0);
                        if (unpaidMatches.length === 1) matchedNick = unpaidMatches[0];
                    }
                }

                if (matchedNick) {
                    matchedAny = true;
                    newMatchedSet.add(dep.id);
                    if (dep.contentId) newMatchedSet.add(dep.contentId);
                    if (dep.legacyId) newMatchedSet.add(dep.legacyId);
                    newLinks[dep.id] = matchedNick;
                    if (dep.contentId) newLinks[dep.contentId] = matchedNick;
                    depositAdditions[matchedNick] = (depositAdditions[matchedNick] || 0) + Number(dep.amount);

                    alreadyLoggedSignatures.add(dep.id);
                    alreadyLoggedSignatures.add(depSig);

                    const existingLogs = Array.isArray(newLogs[matchedNick]) ? [...newLogs[matchedNick]] : [];
                    existingLogs.push({
                        id: dep.id,
                        contentId: dep.contentId || '',
                        legacyId: dep.legacyId || '',
                        name: dep.name,
                        amount: Number(dep.amount),
                        time: fullTimeStr,
                        fullTime: fullTimeStr
                    });
                    newLogs[matchedNick] = existingLogs;
                }
            });

            if (matchedAny) {
                setMatchedDeposits(newMatchedSet);
                setDepositLinks(newLinks);
                setCustomerDepositLogs(newLogs);
                setOrders(prev => {
                    const applied = {};
                    return prev.map(o => {
                        if (!applied[o.customer] && depositAdditions[o.customer] && !o.isCancelled) {
                            applied[o.customer] = true;
                            // 장부(newLogs)에 기록된 실제 총합과 주문서 입금액을 정확히 일치시켜 중복 합산 원천 차단!
                            const logsForCust = newLogs[o.customer];
                            const exactLogSum = Array.isArray(logsForCust) && logsForCust.length > 0
                                ? logsForCust.reduce((s, item) => s + (Number(item.amount) || 0), 0)
                                : ((o.deposit || 0) + depositAdditions[o.customer]);
                            const otherRowsDep = prev
                                .filter(x => x.customer === o.customer && x.id !== o.id && !x.isCancelled)
                                .reduce((s, x) => s + (Number(x.deposit) || 0), 0);
                            return { ...o, deposit: Math.max(0, exactLogSum - otherRowsDep) };
                        }
                        return o;
                    });
                });
            } else {
                // ✨ 대기 상품 삭제나 품목 취소로 인해 입금액이 묶여 있던 줄이 사라졌을 때, 영구 입금 장부(customerDepositLogs)의 합계 금액을 남은 정상 주문 줄로 즉시 자동 복구!
                let needsRecovery = false;
                const recoveryMap = {};
                Object.keys(activeCustomerGroups).forEach(nick => {
                    const logs = customerDepositLogs?.[nick];
                    if (!Array.isArray(logs) || logs.length === 0) return;
                    const expectedDepSum = logs.reduce((s, item) => s + (Number(item.amount) || 0), 0);
                    if (expectedDepSum <= 0) return;
                    const currentActiveDepSum = (activeCustomerGroups[nick] || []).reduce((s, o) => s + (Number(o.deposit) || 0), 0);
                    if (currentActiveDepSum !== expectedDepSum) {
                        needsRecovery = true;
                        recoveryMap[nick] = expectedDepSum;
                    }
                });
                if (needsRecovery) {
                    setOrders(prev => {
                        const recovered = {};
                        return prev.map(o => {
                            if (recoveryMap[o.customer] !== undefined && !o.isCancelled) {
                                if (!recovered[o.customer]) {
                                    recovered[o.customer] = true;
                                    return { ...o, deposit: recoveryMap[o.customer] };
                                }
                                return o.deposit ? { ...o, deposit: 0 } : o;
                            }
                            return o;
                        });
                    });
                }
            }
        }, [isViewingPastBroadcast, isLiveBroadcasting, allDeposits, orders, matchedDeposits, depositLinks, customerDepositLogs, ignoredAutoMatch, archivedDepositIds, depositorNames, addressLookup, masterRealnameMap, getCalculatedShipping, setMatchedDeposits, setDepositLinks, setCustomerDepositLogs, setOrders]);

        const filteredDeposits = useMemo(() => {
            if (!deferredDepositSearch) return allDeposits;
            const term = deferredDepositSearch.toLowerCase();
            return allDeposits.filter(d =>
                String(d.name).toLowerCase().includes(term) ||
                String(d.amount).includes(term) ||
                (depositLinks[d.id] && String(depositLinks[d.id]).toLowerCase().includes(term))
            );
        }, [allDeposits, deferredDepositSearch, depositLinks]);

        const totalDepositAmount = useMemo(() => {
            return filteredDeposits.reduce((sum, d) => sum + (Number(d.amount) || 0), 0);
        }, [filteredDeposits]);

        const groupedOrders = useMemo(() => {
            const map = {};
            orders.forEach(o => {
                if (!map[o.customer]) map[o.customer] = [];
                map[o.customer].push(o);
            });
            const currentNicks = Object.keys(map);
            const cachedOrder = sortOrderCache.current || [];
            const newNicks = currentNicks.filter(n => !cachedOrder.includes(n));
            const validCached = cachedOrder.filter(n => map[n]);
            const finalOrder = [...newNicks, ...validCached];
            sortOrderCache.current = finalOrder;
            return finalOrder.map(nick => [nick, map[nick]]);
        }, [orders]);

        // ✨ 대기 품목을 삭제하거나 취소했을 때 그 줄에 들어있던 입금액이 날아가지 않도록, 영구 입금 장부(customerDepositLogs)의 합계와 활성 주문 줄의 입금액을 항상 일치시키는 자동 복구 가드!
        useEffect(() => {
            if (!orders || orders.length === 0) return;
            let needsFix = false;
            const byCust = {};
            orders.forEach(o => {
                if (!byCust[o.customer]) byCust[o.customer] = [];
                byCust[o.customer].push(o);
            });

            Object.keys(byCust).forEach(nick => {
                const custOrders = byCust[nick];
                const activeRows = custOrders.filter(o => !o.isCancelled);
                const cancelledDep = custOrders.filter(o => o.isCancelled).reduce((s, o) => s + (Number(o.deposit) || 0), 0);
                const activeDep = activeRows.reduce((s, o) => s + (Number(o.deposit) || 0), 0);
                const logs = customerDepositLogs?.[nick];
                const logSum = Array.isArray(logs) && logs.length > 0
                    ? logs.reduce((s, d) => s + (Number(d.amount) || 0), 0)
                    : 0;

                if (activeRows.length > 0 && (cancelledDep > 0 || (logSum > 0 && activeDep !== logSum))) {
                    needsFix = true;
                }
            });

            if (needsFix) {
                setOrders(prev => {
                    const custHandled = {};
                    return prev.map(o => {
                        const nick = o.customer;
                        const custAll = prev.filter(x => x.customer === nick);
                        const activeRows = custAll.filter(x => !x.isCancelled);
                        if (activeRows.length === 0) return o;

                        const totalCurrentDep = custAll.reduce((s, x) => s + (Number(x.deposit) || 0), 0);
                        const logs = customerDepositLogs?.[nick];
                        const logSum = Array.isArray(logs) && logs.length > 0
                            ? logs.reduce((s, d) => s + (Number(d.amount) || 0), 0)
                            : 0;
                        const targetDeposit = logSum > 0 ? Math.max(totalCurrentDep, logSum) : totalCurrentDep;

                        if (o.isCancelled) {
                            return o.deposit ? { ...o, deposit: 0 } : o;
                        }
                        if (!custHandled[nick]) {
                            custHandled[nick] = true;
                            return o.deposit !== targetDeposit ? { ...o, deposit: targetDeposit } : o;
                        }
                        return o.deposit ? { ...o, deposit: 0 } : o;
                    });
                });
            }
        }, [orders, customerDepositLogs, setOrders]);

        const customerPaidStatus = useMemo(() => {
            const status = {};
            groupedOrders.forEach(([nick, items]) => {
                const activeItems = items.filter(i => !i.isCancelled && !i.isWaitlist);
                if (activeItems.length === 0) {
                    status[nick] = false;
                    return;
                }
                const prodSum = activeItems.reduce((s, i) => s + Number(i.price), 0);
                const prodSumForShip = activeItems.reduce((s, i) => s + (Number(i.price) > 0 ? Number(i.price) : 0), 0);
                const ship = getCalculatedShipping(nick, prodSumForShip);
                const logs = customerDepositLogs?.[nick];
                const logSum = Array.isArray(logs) && logs.length > 0 ? logs.reduce((s, d) => s + (Number(d.amount) || 0), 0) : 0;
                const depSum = Math.max(items.reduce((s, i) => s + (Number(i.deposit) || 0), 0), logSum);
                status[nick] = depSum >= (prodSum + ship);
            });
            return status;
        }, [groupedOrders, getCalculatedShipping, customerDepositLogs]);

        const dashboardStats = useMemo(() => {
            let totalSales = 0, totalDeposit = 0, totalUnpaid = 0, totalOverpaid = 0, totalCardExpected = 0, missingAddressCount = 0, waitlistCount = 0;
            groupedOrders.forEach(([nick, items]) => {
                const activeItems = items.filter(i => !i.isCancelled && !i.isWaitlist);
                const waitItems = items.filter(i => !i.isCancelled && i.isWaitlist);
                if (waitItems.length > 0 || waitlistCustomers[nick]) waitlistCount++;
                if (activeItems.length === 0) return;

                const prodSum = activeItems.reduce((s, i) => s + Number(i.price), 0);
                const prodSumForShip = activeItems.reduce((s, i) => s + (Number(i.price) > 0 ? Number(i.price) : 0), 0);
                const ship = getCalculatedShipping(nick, prodSumForShip);
                const depSum = items.reduce((s, i) => s + (Number(i.deposit) || 0), 0);
                const baseGrand = prodSum + ship;
                const baseBal = baseGrand - depSum;
                const isCard = Boolean(cardPayments[nick]);
                const cardFee = (isCard && baseBal > 0) ? Math.round(baseBal * feeMultiplier) : 0;
                const grand = baseGrand + cardFee;

                totalSales += grand;
                totalDeposit += depSum;

                if (isCard) {
                    if (baseBal > 0) totalCardExpected += (baseBal + cardFee);
                } else {
                    if (baseBal > 0) totalUnpaid += baseBal;
                    else if (baseBal < 0) totalOverpaid += Math.abs(baseBal);
                }

                const addrInfo = addressLookup.get(nick)?.data;
                if (!addrInfo || !addrInfo.address) missingAddressCount++;
            });
            return { totalSales, totalDeposit, totalUnpaid, totalOverpaid, totalCardExpected, missingAddressCount, waitlistCount };
        }, [groupedOrders, getCalculatedShipping, cardPayments, feeMultiplier, addressLookup, waitlistCustomers]);

        const noKakaoCount = useMemo(() => {
            return groupedOrders.filter(([nick, items]) => {
                const active = items.filter(i => !i.isCancelled && !i.isWaitlist);
                return active.length > 0 && !checkedOrders.has(nick);
            }).length;
        }, [groupedOrders, checkedOrders]);

        const filteredGroupedOrders = useMemo(() => {
            const search = deferredOrderSearch.trim().toLowerCase();
            return groupedOrders.filter(([nick, items]) => {
                const activeItems = items.filter(i => !i.isCancelled && !i.isWaitlist);
                const waitItems = items.filter(i => !i.isCancelled && i.isWaitlist);
                const prodSum = activeItems.reduce((s, i) => s + Number(i.price), 0);
                const prodSumForShip = activeItems.reduce((s, i) => s + (Number(i.price) > 0 ? Number(i.price) : 0), 0);
                const ship = getCalculatedShipping(nick, prodSumForShip);
                const depSum = items.reduce((s, i) => s + (Number(i.deposit) || 0), 0);
                const baseGrand = prodSum + (activeItems.length > 0 ? ship : 0);
                const baseBal = baseGrand - depSum;
                const isCard = Boolean(cardPayments[nick]);
                const addrInfo = addressLookup.get(nick)?.data;

                if (filterStatus === 'paid' && !(baseBal <= 0 && activeItems.length > 0 && !isCard)) return false;
                if (filterStatus === 'unpaid' && !(baseBal > 0 && !isCard && activeItems.length > 0)) return false;
                if (filterStatus === 'overpaid' && !(baseBal < 0 && !isCard)) return false;
                if (filterStatus === 'card' && !isCard) return false;
                if (filterStatus === 'no-address' && (addrInfo && addrInfo.address)) return false;
                if (filterStatus === 'no-kakao' && checkedOrders.has(nick)) return false;
                if (filterStatus === 'noshow' && !noShowCustomers[nick]) return false;
                if (filterStatus === 'waitlist' && !(waitItems.length > 0 || waitlistCustomers[nick])) return false;

                if (!search) return true;
                if (nick.toLowerCase().includes(search) || getChosung(nick).toLowerCase().includes(search)) return true;
                if (addrInfo && ((addrInfo.realname && addrInfo.realname.toLowerCase().includes(search)) || (addrInfo.phone && addrInfo.phone.includes(search)) || (addrInfo.address && addrInfo.address.toLowerCase().includes(search)))) return true;
                if (depositorNames[nick] && depositorNames[nick].toLowerCase().includes(search)) return true;
                return items.some(i => String(i.product || '').toLowerCase().includes(search));
            });
        }, [groupedOrders, deferredOrderSearch, filterStatus, getCalculatedShipping, cardPayments, addressLookup, checkedOrders, noShowCustomers, waitlistCustomers, depositorNames]);

        const totalItemsCount = useMemo(() => {
            return filteredGroupedOrders.reduce((acc, [_, items]) => acc + items.filter(i => !i.isCancelled).length, 0);
        }, [filteredGroupedOrders]);

        const displayedOrders = useMemo(() => {
            return filteredGroupedOrders.slice(0, displayLimit);
        }, [filteredGroupedOrders, displayLimit]);

        const handleOrderScroll = useCallback((e) => {
            const { scrollTop, scrollHeight, clientHeight } = e.currentTarget;
            if (scrollHeight - scrollTop - clientHeight < 200) {
                setDisplayLimit(prev => Math.min(prev + 30, filteredGroupedOrders.length + 30));
            }
        }, [filteredGroupedOrders.length]);

        const handleNoAddressClick = useCallback(() => {
            setFilterStatus(prev => prev === 'no-address' ? 'all' : 'no-address');
        }, []);

        const handleOpenQuickAddress = useCallback((nick, editData = null) => {
            setQuickAddrModal({ isOpen: true, nick, editData });
        }, []);

        const handleSetCustomerPassword = useCallback((nick, currentPin) => {
            openModal(`'${nick}' 고객님의 주문서 조회용 비밀번호(핸드폰 뒤 4자리)를 입력하세요.`, 'prompt', (val) => {
                if (val === null) return;

                setCustomerPasswords(prev => ({ ...prev, [nick]: clean }));
                if (googleScriptUrl && masterSheetId) {
                    fetchGas(googleScriptUrl, {
                        action: 'save_customer_password',
                        masterId: getCleanSheetId(masterSheetId),
                        data: { nickname: nick, password: clean }
                    }).catch(() => {});
                }
            }, null, currentPin || '');
        }, [openModal, setCustomerPasswords, googleScriptUrl, masterSheetId]);

        const handleSetTrackingNumber = useCallback((nick, currentTrk) => {
            openModal(`'${nick}' 고객님의 롯데택배 송장번호를 입력하세요.\n(비우고 확인을 누르면 송장번호가 삭제됩니다)`, 'prompt', (val) => {
                if (val === null) return;
                const clean = String(val).replace(/[^0-9,-]/g, '').trim();
                trackingSyncLock.current = Date.now();
                setTrackingNumbers(prev => ({ ...prev, [nick]: clean || '__CLEAR__' }));
                if (googleScriptUrl && masterSheetId) {
                    fetchGas(googleScriptUrl, {
                        action: 'save_tracking_numbers',
                        masterId: getCleanSheetId(masterSheetId),
                        broadcastName: broadcastName,
                        data: [{ nickname: nick, trackingNumber: clean || '__CLEAR__' }]
                    }).catch(() => {});
                }
            }, null, currentTrk || '');
        }, [openModal, setTrackingNumbers, googleScriptUrl, masterSheetId, broadcastName]);

        const saveCreditToCloudAndSheet = useCallback((nick, nextCreditAmt, reasonMemo = '직접 입력/수정') => {
            const cleanAmt = Math.max(0, Number(nextCreditAmt) || 0);
            const prevAmt = Math.max(0, Number(customerCredits?.[nick]) || 0);
            const diffAmt = cleanAmt - prevAmt;
            const nowKst = formatDepositFullDateTime(new Date().toISOString());
            creditSyncLock.current = Date.now();
            setCustomerCredits(prev => ({ ...prev, [nick]: cleanAmt }));
            if (window.emberRealtimeDb) {
                const safeKey = String(nick).replace(/[.#$\[\]\/]/g, '_');
                const credRef = window.emberRealtimeDb.ref(`ember_live_data/_portal_credits/${safeKey}`);
                credRef.once('value').then(snap => {
                    const prevVal = snap.val() || {};
                    const prevLogs = Array.isArray(prevVal.logs) ? prevVal.logs : [];
                    const newEntry = {
                        id: `cred_${Date.now()}`,
                        date: nowKst,
                        type: diffAmt >= 0 ? 'add' : 'use',
                        diff: diffAmt,
                        balance: cleanAmt,
                        reason: reasonMemo
                    };
                    credRef.set({
                        nickname: nick,
                        credit: cleanAmt,
                        updatedAt: Date.now(),
                        updatedAtStr: nowKst,
                        logs: [newEntry, ...prevLogs].slice(0, 30)
                    }).catch(() => {});

            if (googleScriptUrl && masterSheetId) {
                fetchGas(googleScriptUrl, {
                    action: 'save_customer_credit',
                    masterId: getCleanSheetId(masterSheetId),
                    data: { nickname: nick, credit: cleanAmt }
                }).catch(() => {});

        }, [customerCredits, setCustomerCredits, googleScriptUrl, masterSheetId]);

        const handleSetCustomerCredit = useCallback((nick, currentCredit) => {
            openModal(`'${nick}' 고객님의 보유 적립금(원)을 입력하세요.\n(입력한 적립금은 직원용 시트와 고객 포털에 적립일시와 함께 실시간 반영됩니다)`, 'prompt', (val) => {

                const targetNewDeposit = Math.max(0, (Number(currentDepTotal) || 0) - amt);
                setOrders(prev => {
                    let applied = false;
                    return prev.map(o => {
                        if (o.customer === nick && !o.isCancelled) {
                            if (!applied) {
                                applied = true;
                                return { ...o, deposit: targetNewDeposit };
                            }
                            return { ...o, deposit: 0 };
                        }
                        return o;
                    });
                });
            });
        }, [customerCredits, openModal, saveCreditToCloudAndSheet, setOrders, broadcastName]);

        const handleApplyCustomerCreditToOrder = useCallback((nick, availableCredit, currentBalance) => {

            openModal(`'${nick}' 고객님의 보유 적립금 ${avail.toLocaleString()}원 중 ${useAmt.toLocaleString()}원을 이번 주문에 차감하시겠습니까?\n\n• 차감 후 남은 보유 적립금: ${remainCredit.toLocaleString()}원\n• 주문서에 '적립금 (-${useAmt.toLocaleString()}원)' 항목이 자동 추가됩니다.`, 'confirm', () => {
                saveCreditToCloudAndSheet(nick, remainCredit, `[${broadcastName || '주문서'}] 주문 차감 사용 (-${useAmt.toLocaleString()}원)`);
                resetCustomerConfirmation(nick);
                setOrders(prev => [

                    {

                        customer: nick,
                        product: '적립금',

                        isUnmodified: false,
                        isWaitlist: false
                    }
                ]);
            });

        const handleClearCurrentOrdersOnly = useCallback(() => {
            openModal(`현재 화면의 주문 목록을 모두 비우시겠습니까?\n(메인시트의 '메인주문' 탭도 함께 깨끗하게 비워집니다)`, 'confirm', () => {
                setOrders([]);
                setShippingOverrides({});
                setCardPayments({});
                setCashReceipts({});
                setNoShowCustomers({});
                setWaitlistCustomers({});
                setCheckedOrders(new Set());
                setCustomerDepositLogs({});

                // 1) 완벽히 일치하는 경우
                if (target === oldStr) return newStr;
                // 2) "11번 치마 블랙 55" 처럼 찾으려는 구문 뒤에 공백과 사이즈가 오는 경우 (가장 흔한 케이스)
                if (target.startsWith(oldStr + ' ')) {
                    return (newStr ? newStr + ' ' : '') + target.slice(oldStr.length + 1);
                }
                // 3) 중간이나 끝에 공백 단위로 정확히 일치하는 경우
                if (target.includes(' ' + oldStr + ' ')) {
                    return target.split(' ' + oldStr + ' ').join(' ' + newStr + ' ').trim();
                }
                if (target.endsWith(' ' + oldStr)) {
                    return target.slice(0, target.length - oldStr.length - 1) + (newStr ? ' ' + newStr : '');
                }
                // 4) 위 공백 기준에 안 걸리더라도 사용자가 입력한 구문이 그대로 들어있는 경우
                if (target.includes(oldStr)) {
                    return target.split(oldStr).join(newStr).trim();
                }
                return null;
            }, []);

            const batchPreviewList = useMemo(() => {
                const { oldStr, newStr } = batchChangeModal;
                if (!oldStr) return [];
                return (inventory || []).map(item => {
                    const nextName = getExactReplacedName(item.name, oldStr, newStr);
                    if (nextName !== null && nextName !== item.name) {
                        return { oldName: item.name, newName: nextName };
                    }
                    return null;
                }).filter(Boolean);
            }, [inventory, batchChangeModal, getExactReplacedName]);

            const executeBatchNameChange = (e) => {
                e.preventDefault();
                const { oldStr, newStr } = batchChangeModal;
                if (!oldStr) return openModal("변경할 대상(찾을 구문)을 입력해주세요.", "alert");
                if (batchPreviewList.length === 0) return openModal("일치하는 상품이 없습니다.", "alert");
                
                const changeMap = {};
                batchPreviewList.forEach(p => { changeMap[p.oldName] = p.newName; });

                setInventory(prev => {
                    const next = prev.map(i => changeMap[i.name] ? { ...i, name: changeMap[i.name] } : i);
                    saveInventoryToServer(next);
                    return next;
                });
                setProductHistory(prev => {
                    const next = { ...prev };
                    Object.entries(changeMap).forEach(([oldN, newN]) => {
                        if (next[oldN] !== undefined) {
                            next[newN] = next[oldN];
                        }
                    });
                    return next;
                });
                setOrders(prev => prev.map(o => {
                    if (changeMap[o.product]) return { ...o, product: changeMap[o.product] };
                    const replaced = getExactReplacedName(o.product, oldStr, newStr);
                    return replaced ? { ...o, product: replaced } : o;
                }));
                setBatchChangeModal({ isOpen: false, oldStr: '', newStr: '' });
                openModal(`총 ${batchPreviewList.length}건의 상품명이 일괄 변경되었습니다.`, "alert");
            };

            const panelChat = useResizablePanel('chat', '16%');
            const panelOrder = useResizablePanel('order', '36%');
            const panelDeposit = useResizablePanel('deposit', '13%');
            const panelInv = useResizablePanel('inv', '19%');
            const panelOpt = useResizablePanel('opt', '16%');

            return (
                <div className="flex h-full gap-2 p-2 overflow-x-auto bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
                    <datalist id="product-list">{Array.isArray(inventory) && inventory.map(i => <option key={i.id} value={i.name} />)}</datalist>
                    <QuickAddressModal isOpen={quickAddrModal.isOpen} nick={quickAddrModal.nick} initialData={quickAddrModal.editData} onClose={() => setQuickAddrModal({ isOpen: false, nick: '', editData: null })} onSubmit={handleQuickAddressSubmit} openModal={openModal} />
                    <MultiAddModal isOpen={!!multiAddNick} nick={multiAddNick} inventory={inventory} onClose={() => setMultiAddNick(null)} addOrderLogic={addOrderLogic} />
                    <SmartMenuModal isOpen={isMenuModalOpen} onClose={() => setIsMenuModalOpen(false)} inventory={inventory} />

                    {batchChangeModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999] animate-pop">
                            <div className="bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-5 w-full max-w-md mx-4 flex flex-col max-h-[85vh]" onClick={e => e.stopPropagation()}>
                                <div className="mb-3 border-b dark:border-slate-700 pb-2.5 flex justify-between items-center shrink-0">
                                    <h3 className="text-base font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2"><Icon name="magic-wand" weight="fill" className="text-purple-500"/> 상품명 통째로 찾아 바꾸기</h3>
                                    <button onClick={() => setBatchChangeModal({ isOpen: false, oldStr: '', newStr: '' })} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><Icon name="x" weight="bold" size={20}/></button>
                                </div>
                                <form onSubmit={executeBatchNameChange} className="flex flex-col flex-1 overflow-hidden gap-3">
                                    <div className="space-y-2.5 shrink-0">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">찾을 상품 구문 (띄어쓰기 포함 입력)</label>
                                            <input type="text" value={batchChangeModal.oldStr} onChange={e=>setBatchChangeModal(p=>({...p, oldStr: e.target.value}))} placeholder="예: 11번 치마 블랙" autoFocus className="w-full border dark:border-slate-600 rounded px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-purple-500 font-bold" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">바꿀 상품 구문 (띄어쓰기 포함 입력)</label>
                                            <input type="text" value={batchChangeModal.newStr} onChange={e=>setBatchChangeModal(p=>({...p, newStr: e.target.value}))} placeholder="예: 11번 치마 챠콜" className="w-full border dark:border-slate-600 rounded px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-purple-500 font-bold" />
                                        </div>
                                    </div>
                                    <div className="flex-1 overflow-y-auto border-t dark:border-slate-700 pt-2.5 space-y-1.5 pr-1">
                                        <div className="text-xs font-bold text-slate-500 flex justify-between items-center mb-1">
                                            <span>변경될 상품 미리보기</span>
                                            <span className="text-purple-600 dark:text-purple-400 font-black">{batchPreviewList.length}건 일치</span>
                                        </div>
                                        {batchPreviewList.length === 0 ? (
                                            <div className="text-center py-6 text-slate-400 text-xs bg-slate-50 dark:bg-slate-900/50 rounded border border-dashed dark:border-slate-700">
                                                일치하는 상품이 없습니다.<br/>(예: '11번 치마 블랙' 입력 시 55, 66, 77 사이즈가 모두 잡힙니다)
                                            </div>
                                        ) : (
                                            batchPreviewList.map((p, idx) => (
                                                <div key={idx} className="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-2 rounded flex flex-col gap-0.5 text-xs">
                                                    <span className="text-slate-400 line-through text-[11px]">{p.oldName}</span>
                                                    <span className="text-purple-600 dark:text-purple-400 font-bold flex items-center gap-1">
                                                        <Icon name="arrow-bend-down-right" weight="bold" /> {p.newName}

                                                </div>

                                    </div>
                                </form>
                            </div>
                        </div>

                            {quickMessages.map((msg, idx) => (

                                 </div>
                             </div>
                             <div className={`text-[10px] p-1.5 rounded flex justify-between items-center ${gasStatus.includes('에러') || gasStatus.includes('실패') || gasStatus.includes('입력하세요') || gasStatus.includes('차단') ? 'bg-red-100 text-red-600 font-bold' : 'text-slate-700 dark:text-slate-300 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 shadow-sm'}`}>
                                 <span className="truncate flex-1 font-bold text-blue-600 dark:text-blue-400 flex items-center gap-1"><Icon name="lightning" weight="fill" className="text-yellow-500"/> 10초 자동 스캔중 <span className="text-slate-500 dark:text-slate-400 font-normal ml-1">| {youtubeStatus} | {gasStatus}</span></span>
                             </div>
                             <div className="flex gap-2">
                                 <div className="relative flex-1"><Icon name="magnifying-glass" className="absolute left-1.5 top-1/2 -translate-y-1/2 text-slate-400 text-[10px]"/><input type="text" placeholder="검색" value={chatSearch} onChange={e => setChatSearch(e.target.value)} onKeyDown={e => { if(e.key==='Escape'){ setChatSearch(''); e.target.blur(); } }} className="w-full text-[10px] pl-5 py-1.5 border dark:border-slate-600 rounded outline-none bg-white dark:bg-slate-900 focus:ring-1 focus:ring-slate-400" /></div>
                                 <form onSubmit={handleAddKeyword} className="flex gap-1 w-[45%]">
                                     <input type="text" value={keywordInput} onChange={(e) => setKeywordInput(e.target.value)} onKeyDown={e => { if(e.key==='Escape'){ setKeywordInput(''); e.target.blur(); } }} placeholder="키워드" className="w-full text-[10px] border dark:border-slate-600 rounded px-1.5 py-1.5 bg-white dark:bg-slate-900 outline-none focus:ring-1 focus:ring-slate-400" />
                                     <button type="submit" className="bg-slate-600 hover:bg-slate-700 text-white px-1.5 rounded text-[10px] font-bold transition-colors">＋</button>
                                     {(keywords || []).length > 0 && <button type="button" onClick={() => openModal('키워드를 모두 삭제하시겠습니까?', 'confirm', () => setKeywords([]))} className="bg-red-500 hover:bg-red-600 text-white px-1.5 rounded text-[10px] font-bold whitespace-nowrap transition-colors shadow-sm">비우기</button>}
                                 </form>
                             </div>
                             {(keywords || []).length > 0 && (<div className="flex gap-1 overflow-x-auto scrollbar-hide py-0.5">{(keywords || []).map(k => (<span key={k} onClick={() => handleRemoveKeyword(k)} className="bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 px-1.5 py-0.5 rounded-full text-[10px] cursor-pointer whitespace-nowrap hover:bg-red-100 hover:text-red-600 transition-colors flex items-center gap-0.5">{k} <Icon name="x" weight="bold" size={8}/></span>))}</div>)}
                        </div>
                        <div ref={chatScrollRef} className="flex-1 overflow-y-auto p-1.5 space-y-1 bg-slate-50 dark:bg-slate-900">
                            {visibleReversedChats.map((c, idx) => {
                                const safeContent = String(c.content || ''); const isMatched = (keywords || []).some(k => safeContent.includes(k)); const isProcessed = clickedChats?.has(c.id);
                                const isFocused = isFixedProductMode && focusedChatId === c.id;
                                const shortTime = String(c.time || '').replace(/^(\d{2}:\d{2}):\d{2}$/, '$1');
                                const chatNormNick = normalizeString(c.nickname);
                                const chatSpec = specialCustomers?.[chatNormNick];
                                const isChatBlack = chatSpec?.type === 'blacklist';
                                const chatNoShowCnt = chatSpec?.type === 'noshow' ? Math.max(1, Number(chatSpec?.count) || 1) : 0;
                                
                                let chatClasses = '';
                                if (isChatBlack) {
                                    chatClasses = 'bg-red-950/90 text-red-100 border-2 border-red-600 shadow-sm';
                                } else if (isFocused) {
                                    chatClasses = 'bg-blue-50/90 dark:bg-blue-900/40 border-2 border-blue-500 text-slate-900 dark:text-white shadow-sm';
                                } else if (isProcessed) {
                                    chatClasses = 'bg-slate-100 dark:bg-slate-800/60 border border-slate-300 dark:border-slate-700 text-slate-500 dark:text-slate-400';
                                } else if (isMatched) {
                                    chatClasses = 'bg-slate-100/90 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-100 shadow-sm';
                                } else {
                                    chatClasses = 'bg-white dark:bg-slate-800 border border-slate-200/90 dark:border-slate-700/80 text-slate-800 dark:text-slate-200 hover:border-slate-300';
                                }

                                return (
                                    <div
                                        key={c.id || idx}
                                        onClick={() => { setFocusedChatId(c.id); handleChatClick(c); }}
                                        className={`p-2 rounded-md text-xs cursor-pointer transition-all flex flex-col gap-0.5 relative group ${chatClasses}`}
                                    >
                                        <div className="flex items-center justify-between gap-1">
                                            <div className="flex items-center gap-1 min-w-0">
                                                <span className={`font-extrabold text-[12px] truncate ${isChatBlack ? 'text-red-300 line-through' : (isProcessed ? 'text-slate-600 dark:text-slate-400' : 'text-slate-900 dark:text-slate-100')}`}>{c.nickname}</span>
                                                {isChatBlack && <span className="bg-red-600 text-white text-[9px] font-black px-1 py-0.2 rounded shrink-0">💀블랙</span>}
                                                {chatNoShowCnt > 0 && <span className="bg-red-100 text-red-700 border border-red-300 text-[9px] font-extrabold px-1 py-0.2 rounded shrink-0">🚫노쇼{chatNoShowCnt}회</span>}
                                            </div>
                                            <div className="flex items-center gap-1 shrink-0">
                                                <span className="text-[10px] text-slate-400 tabular-nums">{shortTime}</span>
                                                <button
                                                    type="button"
                                                    onClick={(e) => { e.stopPropagation(); setHiddenChatIds(prev => [...prev, c.id]); }}
                                                    className="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 p-0.5 transition-opacity"
                                                    title="이 채팅 숨기기"
                                                >
                                                    <Icon name="x" weight="bold" size={10} />
                                                </button>
                                            </div>
                                        </div>
                                        <div className={`leading-relaxed break-words text-[12px] ${isChatBlack ? 'text-red-200' : (isProcessed ? 'text-slate-500 dark:text-slate-400' : 'text-slate-700 dark:text-slate-200')}`}>
                                            {renderChatContent(safeContent, keywords)}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div ref={panelOrder.ref} className="flex flex-col bg-white dark:bg-slate-800 border dark:border-slate-700 rounded-lg flex flex-col shadow-sm resizable-panel" style={{ width: panelOrder.width, minWidth: '280px' }}>
                        <div className="grid grid-cols-5 gap-1 p-2 bg-slate-100 dark:bg-slate-800 border-b dark:border-slate-700 text-center text-[10px] shrink-0">
                            {[{id:'all', label:'총매출', val:dashboardStats.totalSales, isCurrency:true, colSpan:2}, 
                              {id:'no-address', label:'주소없음', val:dashboardStats.missingAddressCount, isCurrency:false, onClick:handleNoAddressClick},
                              {id:'no-kakao', label:'주문미확인', val:noKakaoCount, isCurrency:false},
                              {id:'noshow', label:'노쇼', val:Object.values(noShowCustomers).filter(Boolean).length, isCurrency:false},
                              {id:'waitlist', label:'대기', val:dashboardStats.waitlistCount, isCurrency:false},
                              {id:'paid', label:'완납', val:dashboardStats.totalDeposit, isCurrency:true}, 
                              {id:'unpaid', label:'미수금', val:dashboardStats.totalUnpaid, isCurrency:true}, 
                              {id:'overpaid', label:'과납', val:dashboardStats.totalOverpaid, isCurrency:true},
                              {id:'card', label:'카드예정', val:dashboardStats.totalCardExpected, isCurrency:true}
                            ].map(s => (
                                <div key={s.id} onClick={s.onClick || (()=>setFilterStatus(s.id))} className={`bg-white dark:bg-slate-800 p-1 rounded border-2 cursor-pointer shadow-sm transition-colors flex flex-col justify-center overflow-hidden ${s.colSpan === 2 ? 'col-span-2' : ''} ${filterStatus===s.id ? 'border-slate-600 dark:border-slate-400' : 'border-transparent hover:border-slate-300 dark:hover:border-slate-600'}`}>
                                    <div className="text-[9px] text-slate-500">{s.label}</div>
                                    <div className={`font-bold truncate ${s.colSpan ? 'text-[13px]' : 'text-[10px]'} ${s.id==='paid'?'text-green-600 dark:text-green-400':s.id==='unpaid'?'text-red-500 dark:text-red-400':s.id==='overpaid'?'text-orange-500 dark:text-orange-400':s.id==='card'?'text-purple-600 dark:text-purple-400':s.id==='no-address'?'text-amber-600 dark:text-amber-400':s.id==='noshow'?'text-red-600 dark:text-red-400':s.id==='waitlist'?'text-orange-500 dark:text-orange-400':'text-slate-800 dark:text-slate-200'}`}>
                                        {s.val.toLocaleString()}{s.isCurrency?'원':'명'}
                                    </div>
                                </div>
                            ))}
                        </div>
