                        const finalCardAmount = cardBase + cFee;
                        if (depositTotal > 0) { msg += `[카드결제]\n총 주문금액 ${baseGrandTotal.toLocaleString()}원\n선입금 ${depositTotal.toLocaleString()}원\n남은 결제금액 ${cardBase.toLocaleString()}원\n수수료(${feeRateNum}%) ${cFee.toLocaleString()}원\n👉최종 결제요청액 ${finalCardAmount.toLocaleString()}원 예정\n\n방송종료 시간이 늦을경우 오전에 카드결제 링크 발송합니다.\n------------------\n`; } 
                        else { msg += `[카드결제]\n주문금액 ${cardBase.toLocaleString()}원\n수수료(${feeRateNum}%) ${cFee.toLocaleString()}원\n👉결제요청액 ${finalCardAmount.toLocaleString()}원 예정\n\n방송종료 시간이 늦을경우 오전에 카드결제 링크 발송합니다.\n------------------\n`; }
                    } else { 
                        const isPaid = (balance <= 0) && (grandTotal >= 0); 
                        if (depositTotal > 0 && balance <= 0) { msg += `[입금확인]\n총 주문금액 ${baseGrandTotal.toLocaleString()}원\n입금확인 ${depositTotal.toLocaleString()}원\n`; } 
                        else if (depositTotal > 0 && balance > 0) { msg += `[입금확인]\n총 주문금액 ${baseGrandTotal.toLocaleString()}원\n입금확인 ${depositTotal.toLocaleString()}원 (일부 입금)\n------------------\n`; }
                        
                        const cashReceiptText = (hasCashReceipt && depositTotal > 0) ? `\n현금영수증 : ${depositTotal.toLocaleString()}원 예정` : '';

                        if (balance > 0) {
                            statusStr = depositTotal > 0 ? `부분입금(미수 ${balance.toLocaleString()})` : `미입금(미수 ${balance.toLocaleString()})`;
                            if (depositTotal > 0) { msg += `\n[부분 미수 안내]\n남은 입금하실 금액 👉 ${balance.toLocaleString()}원\n\n${bankStr}\n추가 입금 부탁드립니다 🙏\n------------------\n`; } 
                            else { msg += `${templateConfigLocal.unpaidPrefix}\n${balance.toLocaleString()}원\n\n${bankStr}\n입금 부탁드립니다 🙏\n------------------\n`; }
                        } else if (balance < 0) { statusStr = '과납'; msg += `${templateConfigLocal.paidMsg}${cashReceiptText}\n\n[과납 안내]\n과납액: ${Math.abs(balance).toLocaleString()}원\n${overpaidMsg}\n------------------\n`; } 
                        else { statusStr = '입금'; if (isPaid) msg += `${templateConfigLocal.paidMsg}${cashReceiptText}\n------------------\n`; }
                    }
                    
                    if (waitlistItems.length > 0) {
                        const waitlistText = waitlistItems.map(i => {
                            const wRank = localWaitRankMap[`${String(i.product || '').trim()}___${nick}`];
                            const rankBadge = wRank ? ` (대기 ${wRank}번)` : ' (대기)';
                            return `• ${i.product}${i.quantity > 1 ? ` ★${i.quantity}개` : ''}${rankBadge}`;
                        }).join('\n');
                        msg += `\n[⏱️ 품절/거파 대기 상품]\n${waitlistText}\n* 미입금 취소분 발생 시 순번대로 별도 연락드립니다.\n------------------\n`;
                    }

                    // ✨ 하단 핑크색 배너 ☆주문서확인 안내 문구
                    msg += `\n채팅창 하단 핑크색 배너 【 ☆주문서확인 】에 들어가셔서\n상세 주문내역 및 배송지 확인을 꼭 완료해 주세요! 💖`;

                    data.push({ '닉네임': nick, '상품명': itemListTextForExcel, '가격': grandTotal.toLocaleString() + '원', '입금액': depositTotal.toLocaleString() + '원', '상태': statusStr, '카톡전송메세지': msg });
                });
                if (data.length === 0) { openModal("주문 내역이 없습니다.", "alert"); return; }
                data.sort((a, b) => String(a['닉네임'] || '').localeCompare(String(b['닉네임'] || '')));
                downloadExcel(data, '전체고객_카톡메세지_리스트');
            };

            const handlePrintPackingList = () => {
                const groups = {}; orders.forEach(o => { if (o.isCancelled || o.isWaitlist) return; if (!groups[o.customer]) groups[o.customer] = []; groups[o.customer].push(o); });
                if (Object.keys(groups).length === 0) { openModal("인쇄할 주문 내역이 없습니다.", "alert"); return; }
                let printContent = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>포장리스트_인쇄</title><style>@import url("https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo/nanumsquareneo.css");@page { size: 100mm 150mm; margin: 0 !important; }* { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }html, body { margin: 0; padding: 0; width: 100mm; background: #fff; color: #000; font-family: 'NanumSquareNeo', sans-serif; }.slip { width: 100mm; padding: 8mm 4mm 4mm 4mm; page-break-after: always; position: relative; }.nick { font-size: 26px; font-weight: 900; text-align: center; margin-bottom: 12px; border: 2px solid #000; padding: 8px 5px; border-radius: 8px; box-shadow: 3px 3px 0 #000; background-color: #fff; }table { width: 100%; border-collapse: collapse; margin-bottom: 10px; table-layout: fixed; }thead { display: table-header-group; }tr { page-break-inside: avoid; page-break-after: auto; }th, td { border-bottom: 1px solid #000; padding: 6px 2px; text-align: left; vertical-align: middle; }th { font-size: 13px; color: #000; border-bottom: 2px solid #000; padding-bottom: 4px; }.right { text-align: right; }.product-name { font-weight: 800; font-size: 15px; word-break: break-all; overflow-wrap: anywhere; line-height: 1.3; padding-right: 5px; }.qty { font-weight: 900; font-size: 16px; white-space: nowrap; text-align: right; width: 45px; }.total { font-size: 18px; font-weight: 900; text-align: right; border-top: 2px solid #000; padding-top: 8px; margin-top: 8px; }.footer { text-align: center; font-size: 12px; font-weight: bold; border-top: 1px dashed #000; padding-top: 8px; margin-top: 15px; margin-bottom: 5px; }</style></head><body>`;
                const sortedCustomers = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'ko'));
                sortedCustomers.forEach(nick => {
                    const items = groups[nick]; items.sort((a, b) => String(b.product || '').localeCompare(String(a.product || ''), 'ko', { numeric: true }));
                    let totalQty = 0;
                    let itemsHtml = items.map(item => { const q = Number(item.quantity) || 0; totalQty += q; return '<tr><td class="product-name">' + item.product + '</td><td class="qty right">' + q + '개</td></tr>'; }).join('');
                    const totalItems = items.length;
                    printContent += '<div class="slip"><div class="nick">' + nick + '</div><table><thead><tr><th>상품명</th><th class="right">수량</th></tr></thead><tbody>' + itemsHtml + '</tbody></table><div class="total">합계: ' + totalItems + '품목 ' + totalQty + '개</div><div class="footer">구매해 주셔서 감사합니다 ❤️</div></div>';
                });
                printContent += '<script>window.onload=function(){setTimeout(function(){window.print();},500);}</' + 'script></body></html>';
                const printWin = window.open('', '_blank', 'width=450,height=650');
                if (printWin) { printWin.document.open(); printWin.document.write(printContent); printWin.document.close(); } 
                else { openModal("팝업 차단이 설정되어 있습니다. 팝업을 허용해 주세요.", "alert"); }
            };

            const fileInputRef = useRef(null); 
            const chatFileInputRef = useRef(null);

            // ✨ 지난 방송 채팅 엑셀 파일 업로드 처리 로직
            const handleExcelChatUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = window.XLSX.read(data, {type: 'array'});
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = window.XLSX.utils.sheet_to_json(firstSheet, {header: 1});
                        
                        const importedChats = [];
                        let startIndex = 0;
                        // 만약 첫 줄이 헤더(예: 시간, 닉네임, 내용)라면 스킵
                        if (jsonData.length > 0 && String(jsonData[0][1] || '').includes('닉네임')) startIndex = 1;

                        for (let i = startIndex; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            if (!row || row.length < 2) continue; // 닉네임과 내용이 없으면 무시
                            
                            let time = row[0] ? String(row[0]) : '';
                            let nickname = row[1] ? String(row[1]) : '';
                            let content = row[2] ? String(row[2]) : '';
                            
                            if (nickname && content) {
                                importedChats.push({
                                    id: `imported_${Date.now()}_${i}`,
                                    time: time,
                                    nickname: nickname.replace(/@/g, '').trim(),
                                    content: content
                                });
                            }
                        }

                        if (importedChats.length > 0) {
                            // 라이브 탭으로 커스텀 이벤트를 쏴서 즉시 반영
                            window.dispatchEvent(new CustomEvent('import-chats', { detail: importedChats }));
                            openModal(`${importedChats.length}개의 채팅을 성공적으로 병합했습니다.`, 'alert');
                        } else {
                            openModal('업로드할 데이터가 없습니다.\n양식(A열:시간, B열:닉네임, C열:내용)을 확인해주세요.', 'alert');
                        }
                    } catch (error) {
                        openModal('엑셀 파일을 읽는 중 오류가 발생했습니다.', 'alert');
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = ''; // 같은 파일을 다시 올려도 동작하도록 리셋
            };

            const handleTrackingExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = window.XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = window.XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

                        // 현재 열려있는 주문서의 고객 목록 (닉네임 & 수령인명/수하인명)
                        const activeCustomerNicks = Array.from(new Set(orders.filter(o => !o.isCancelled).map(o => o.customer)));

                        // 수하인명(실명) 또는 닉네임 기준으로 일치하는 모든 고객 닉네임 배열을 반환 (동명이인 감지용)
                        const findMatchingNicksInOpenOrders = (inputNick, inputRealname, inputPhone) => {
                            const cleanInNick = normalizeString(inputNick);
                            const cleanInName = normalizeString(inputRealname);
                            const cleanInPhone = String(inputPhone || '').replace(/[^0-9]/g, '');

                            // 1순위: 연락처가 함께 있고 정확히 일치하는 경우
                            if (cleanInPhone && cleanInPhone.length >= 8) {
                                const phoneMatches = activeCustomerNicks.filter(cNick => {
                                    const addrInfo = findAddress(cNick);
                                    const cPhone = String(addrInfo?.phone || '').replace(/[^0-9]/g, '');
                                    return cPhone === cleanInPhone;
                                });
                                if (phoneMatches.length === 1) return phoneMatches;
                            }

                            // 2순위: 닉네임과 정확히 일치하는 경우
                            if (cleanInNick) {
                                const nickMatches = activeCustomerNicks.filter(cNick => 
                                    normalizeString(cNick) === cleanInNick || cleanForMatch(cNick) === cleanForMatch(inputNick)
                                );
                                if (nickMatches.length > 0) return nickMatches;
                            }

                            // 3순위: 수하인명(수령인 실명)으로 매칭 (동명이인이 여러 명일 수 있음)
                            const targetName = cleanInName || cleanInNick;
                            if (targetName) {
                                const nameMatches = activeCustomerNicks.filter(cNick => {
                                    const cNorm = normalizeString(cNick);
                                    const addrInfo = findAddress(cNick);
                                    const cRealNorm = normalizeString(addrInfo?.realname || '');
                                    return cRealNorm === targetName || cNorm === targetName;
                                });
                                if (nameMatches.length > 0) return nameMatches;
                            }

                            return [];
                        };

                        const parsedList = [];
                        const localTrkMap = {};
                        const duplicateWarnings = [];

                        rows.forEach(r => {
                            const keys = Object.keys(r);
                            let nick = '', realname = '', phone = '', trk = '';
                            keys.forEach(k => {
                                const cleanK = k.replace(/\s+/g, '');
                                const val = String(r[k] || '').trim();
                                if (!val) return;
                                if (cleanK.includes('닉네임') || cleanK.includes('주문자')) {
                                    nick = val.replace(/^\[.*?\]\s*/, '').trim();
                                } else if (cleanK.includes('수하인') || cleanK.includes('수령인') || cleanK.includes('받는분') || cleanK.includes('받는사람') || cleanK === '이름' || cleanK === '성명' || cleanK === '고객명') {
                                    realname = val.replace(/^\[.*?\]\s*/, '').trim();
                                } else if (cleanK.includes('전화') || cleanK.includes('연락처') || cleanK.includes('핸드폰') || cleanK.includes('휴대폰') || cleanK.includes('수하인전화')) {
                                    phone = val.replace(/[^0-9]/g, '');
                                } else if (cleanK.includes('운송장') || cleanK.includes('송장') || cleanK.includes('등기') || cleanK.includes('화물번호')) {
                                    trk = val.replace(/[^0-9,-]/g, '');
                                }
                            });

                            if (trk && (nick || realname || phone)) {
                                const matchedNicks = findMatchingNicksInOpenOrders(nick, realname, phone);
                                if (matchedNicks.length > 1) {
                                    // 🚨 동명이인(또는 동일 닉네임) 2명 이상 발견 시 자동 매칭 보류 및 알림 목록에 추가
                                    const displayName = realname || nick;
                                    duplicateWarnings.push(`• 수하인명 '${displayName}' (운송장: ${trk}) ➔ 동명이인 닉네임: [${matchedNicks.join(', ')}]`);
                                } else if (matchedNicks.length === 1) {
                                    const matchedOpenNick = matchedNicks[0];
                                    parsedList.push({ nickname: matchedOpenNick, realname: realname || nick, phone, trackingNumber: trk });
                                    localTrkMap[matchedOpenNick] = trk;
                                } else {
                                    // 현재 열려있는 주문서에 없더라도 시트에 직접 있을 수 있으므로 전달
                                    parsedList.push({ nickname: nick || '', realname: realname || nick, phone, trackingNumber: trk });
                                }
                            }
                        });

                        if (parsedList.length === 0 && duplicateWarnings.length === 0) {
                            openModal('엑셀에서 데이터를 찾지 못했습니다.\n열 제목에 [수하인명(또는 수령인명/닉네임)]과 [운송장번호(또는 송장번호)]가 포함되어 있는지 확인해 주세요.', 'alert');
                            return;
                        }

                        if (Object.keys(localTrkMap).length > 0) {
                            setTrackingNumbers(prev => ({ ...prev, ...localTrkMap }));
                        }

                        if (googleScriptUrl && masterSheetId && parsedList.length > 0) {
                            const res = await fetchGas(googleScriptUrl, {
                                action: 'save_tracking_numbers',
                                masterId: getCleanSheetId(masterSheetId),
                                broadcastName: targetTrackingBroadcast || broadcastName,
                                data: parsedList
                            });

                            const serverDupes = (res && Array.isArray(res.duplicates)) ? res.duplicates : [];
                            const allDupes = [...duplicateWarnings];
                            serverDupes.forEach(sd => {
                                const msg = `• 수하인명 '${sd.realname}' (운송장: ${sd.trackingNumber}) ➔ 시트 내 동명이인: [${sd.nicknames.join(', ')}]`;
                                if (!allDupes.some(d => d.includes(sd.trackingNumber))) allDupes.push(msg);
                            });

                            if (res && res.success) {
                                let resultMsg = `[${targetTrackingBroadcast || broadcastName}] 시트에 총 ${parsedList.length}건의 운송장번호가 등록되었습니다!`;
                                if (allDupes.length > 0) {
                                    resultMsg += `\n\n⚠️ [동명이인 감지 - ${allDupes.length}건 자동등록 보류]\n닉네임이 다른데 수하인명이 똑같은 고객이 있어 아래 건은 보류했습니다. 주문서에서 직접 [송장입력] 버튼을 눌러 넣어주세요!\n\n` + allDupes.join('\n');
                                }
                                openModal(resultMsg, 'alert');
                            } else {
                                openModal(`로컬에는 반영되었으나 시트 저장 중 오류가 발생했습니다: ${res?.error || res?.message || ''}`, 'alert');
                            }
                        } else {
                            let resultMsg = `총 ${parsedList.length}건의 운송장번호가 등록되었습니다.`;
                            if (duplicateWarnings.length > 0) {
                                resultMsg += `\n\n⚠️ [동명이인 감지 - ${duplicateWarnings.length}건 자동등록 보류]\n닉네임이 다른데 수하인명이 똑같은 고객이 있어 아래 건은 보류했습니다. 주문서에서 직접 [송장입력] 버튼을 눌러 넣어주세요!\n\n` + duplicateWarnings.join('\n');
                            }
                            openModal(resultMsg, 'alert');
                        }
                    } catch (err) {
                        openModal('송장 엑셀 파일을 읽는 중 오류가 발생했습니다.', 'alert');
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = '';
            };

            return (
                <div className="flex flex-col items-center justify-center h-full p-10 gap-6 overflow-y-auto dark:bg-slate-900">
                    <div className="grid grid-cols-2 gap-6 w-full max-w-5xl"> 
                        <div className="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-lg border dark:border-slate-700 text-center">
                            <h2 className="text-lg font-bold mb-2 dark:text-slate-100 flex items-center justify-center gap-2"><Icon name="clipboard-text" weight="fill" className="text-slate-600"/> 발주용 품목 집계</h2>
                            <p className="text-slate-500 dark:text-slate-400 mb-4 text-xs">상품별 전체 수량 요약 (취소건 및 대기건 제외)</p>
                            <button onClick={handleExportProducts} className="w-full bg-slate-700 text-white font-bold py-3 rounded-lg transition-transform hover:scale-105 shadow-md flex items-center justify-center gap-2 hover:bg-slate-800"><Icon name="download-simple" weight="bold"/> 엑셀 다운로드</button>
                        </div>
                        <div className="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-lg border dark:border-slate-700 text-center">
                            <h2 className="text-lg font-bold mb-2 dark:text-slate-100 flex items-center justify-center gap-2"><Icon name="users" weight="fill" className="text-slate-600"/> 배송용 고객 리스트 (전체)</h2>
                            <p className="text-slate-500 dark:text-slate-400 mb-4 text-xs">완납 상단 / 카드 중간 / 노쇼 하단 자동 정렬 (대기건 제외)</p>
                            <button onClick={handleExportCustomers} className="w-full bg-slate-700 text-white font-bold py-3 rounded-lg transition-transform hover:scale-105 shadow-md flex items-center justify-center gap-2 hover:bg-slate-800"><Icon name="download-simple" weight="bold"/> 엑셀 다운로드</button>
                        </div>
                        <div className="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-lg border dark:border-slate-700 text-center ring-2 ring-blue-100 dark:ring-blue-900/30">
                            <h2 className="text-lg font-bold mb-2 text-blue-600 dark:text-blue-400 flex items-center justify-center gap-2"><Icon name="chat-circle-dots" weight="fill"/> 전체 카톡 전송 메시지</h2>
                            <p className="text-slate-500 dark:text-slate-400 mb-4 text-xs">카톡 메시지 일괄 (대기 상품 안내 포함)</p>
                            <button onClick={handleExportAllMessages} className="w-full bg-blue-500 text-white font-bold py-3 rounded-lg transition-transform hover:scale-105 shadow-md flex items-center justify-center gap-2 hover:bg-blue-600"><Icon name="download-simple" weight="bold"/> 엑셀 다운로드</button>
                        </div>

                                const depJson = depLogsArr.length > 0 ? JSON.stringify(depLogsArr) : '';
                                const rawTrk = (trackingNumbers && trackingNumbers[nick] && trackingNumbers[nick] !== '__CLEAR__') ? trackingNumbers[nick] : '';
                                const cleanAddrStr = stripZipcodeFromAddr(matchedAddr.address || '');

                                closedPortalCustomers.push({
                                    sheetTabName: archiveSheetName,
                                    nickname: nick,
                                    phoneLast4: pin4,
                                    broadcastName: prevBroadcastTitle,
                                    isVip: isVip,
                                    isNoShow: Boolean(noShowCustomers[nick]),
                                    credit: Number(customerCredits?.[nick]) || 0,
                                    freeShippingThreshold: Number(freeShippingThreshold) || 70000,
                                    cardFeeRate: feeRateNumNow,
                                    isCard: cardStr,
                                    cashReceipt: cashVal === 'completed' ? 'completed' : (cashVal ? 'requested' : 'none'),
                                    shipping: shipFee,
                                    depositTotal: depSum,
                                    deposits: depLogsArr,
                                    items: custOrders.map((co, cIdx) => ({
                                        id: cIdx + 1,
                                        product: co.product || '',
                                        qty: Number(co.quantity) || 1,
                                        price: Number(co.price) || 0,
                                        isWaitlist: Boolean(co.isWaitlist),
                                        waitlistOrder: co.isWaitlist ? 1 : 0
                                    })),
                                    address: (cleanAddrStr || matchedAddr.realname) ? {
                                        realname: matchedAddr.realname || depositorNames[nick] || '',
                                        phone: cleanPh,
                                        zipcode: '',
                                        baseAddress: cleanAddrStr,
                                        detailAddress: '',
                                        memo: matchedAddr.memo || '',
                                        updatedAt: matchedAddr.timestamp || ''
                                    } : null,
                                    trackingNumbers: rawTrk ? [rawTrk] : [],
                                    isConfirmed: Boolean(checkedOrders && checkedOrders.has(nick))
                                });

                                custOrders.forEach((o, idx) => {
                                    prevArchiveRows.push({
                                        '닉네임': nick,
                                        '주문자': nick,
                                        customer: nick,
                                        nickname: nick,
                                        name: nick,
                                        '상품명': o.product || '',
                                        product: o.product || '',
                                        '수량': Number(o.quantity) || 1,
                                        quantity: Number(o.quantity) || 1,
                                        qty: Number(o.quantity) || 1,
                                        '단가(제품금액)': Number(o.price) || 0,
                                        price: Number(o.price) || 0,
                                        '배송비': shipFee,
                                        shipping: shipFee,
                                        '입금액': idx === 0 ? depSum : 0,
                                        deposit: idx === 0 ? depSum : 0,
                                        '카드결제': cardStr,
                                        '수령인명': matchedAddr.realname || depositorNames[nick] || '',
                                        '연락처': cleanPh ? "'" + cleanPh : '',
                                        '주소': cleanAddrStr,
                                        '요청사항': matchedAddr.memo || '',
                                        'VIP여부': isVip ? 'O' : '',
                                        '노쇼여부': noShowCustomers[nick] ? 'O' : '',
                                        '대기여부': o.isWaitlist ? '대기1번' : '',
                                        '비밀번호': pin4 ? "'" + pin4 : '',
                                        '주문확인': (checkedOrders && checkedOrders.has(nick)) ? 'O' : '',
                                        '입금내역JSON': idx === 0 ? depJson : '',
                                        '송장번호': rawTrk ? "'" + rawTrk : ''
                                    });
                                });
                            });
                        }

                        const lockedItems = Array.isArray(inventory) ? inventory.filter(i => i.isLocked) : [];

                        // ✨ 방송 마감 시 화면에서 채팅을 지우기 전에, 오늘 수집된 전체 채팅 내역을 구글 시트('채팅기록' 탭)에 먼저 백업 보장!
                        let savedChatsSnapshot = [];
                        try {
                            const rawSavedChats = localStorage.getItem(getLsKey('savedChats'));
                            if (rawSavedChats) {
                                const parsedChats = JSON.parse(rawSavedChats);
                                if (Array.isArray(parsedChats)) savedChatsSnapshot = parsedChats;
                            }
                        } catch (e) {}

                        // 1순위: 화면 상태부터 즉시 마감(🔒 방송마감)으로 전환하고 주문서/재고 초기화!
                        setIsLiveBroadcasting(false);
                        setBroadcastName(nextTitle);

                        let mergedArchived = [];
                        try {
                            const prevArchivedStr = localStorage.getItem(getLsKey('archivedDepositIds'));
                            const prevArchived = prevArchivedStr ? JSON.parse(prevArchivedStr) : [];
                            mergedArchived = Array.from(new Set([...prevArchived, ...matchedDeposits]));
                            localStorage.setItem(getLsKey('archivedDepositIds'), JSON.stringify(mergedArchived));
                        } catch (e) {}

                        try {
                            localStorage.setItem(getLsKey('isLiveBroadcasting'), JSON.stringify(false));
                            localStorage.setItem(getLsKey('broadcastName'), JSON.stringify(nextTitle));
                            localStorage.setItem(getLsKey('youtubeOrders'), JSON.stringify([]));
                            localStorage.setItem(getLsKey('productHistory'), JSON.stringify({}));
                            localStorage.setItem(getLsKey('shippingOverrides'), JSON.stringify([]));
                            localStorage.setItem(getLsKey('cardPayments'), JSON.stringify({}));
                            localStorage.setItem(getLsKey('matchedDeposits'), JSON.stringify(mergedArchived));
                            localStorage.setItem(getLsKey('depositLinks'), JSON.stringify({}));
                            localStorage.setItem(getLsKey('customerDepositLogs'), JSON.stringify({}));
                            localStorage.setItem(getLsKey('depositorNames'), JSON.stringify({}));
                            localStorage.setItem(getLsKey('clickedChats'), JSON.stringify([]));
                            localStorage.setItem(getLsKey('chatKeywords'), JSON.stringify([]));
                            localStorage.setItem(getLsKey('sentAddressRequests'), JSON.stringify([]));
                            localStorage.setItem(getLsKey('deletedDepositIds'), JSON.stringify([]));
                            localStorage.setItem(getLsKey('checkedOrders'), JSON.stringify([]));
                            localStorage.setItem(getLsKey('addressMapping'), JSON.stringify({}));
                            localStorage.setItem(getLsKey('cashReceipts'), JSON.stringify({}));
                            localStorage.setItem(getLsKey('inventory'), JSON.stringify(lockedItems));
                            localStorage.setItem(getLsKey('manualDeposits'), JSON.stringify([]));
                            localStorage.setItem(getLsKey('noShowCustomers'), JSON.stringify({}));
                            localStorage.setItem(getLsKey('waitlistCustomers'), JSON.stringify({}));
                            localStorage.setItem(getLsKey('trackingNumbers'), JSON.stringify({}));
                            localStorage.removeItem(getLsKey('ignoredAutoMatch'));
                            localStorage.removeItem(getLsKey('savedChats'));
                        } catch (e) {}

                        setOrders([]); setProductHistory({}); setShippingOverrides({}); setCardPayments({}); 
                        setMatchedDeposits(new Set(mergedArchived)); setDepositLinks({}); setCustomerDepositLogs({}); 
                        setDepositorNames({}); setClickedChats(new Set()); setKeywords([]); 
                        setSentAddressRequests(new Set()); setDeletedDepositIds(new Set()); setCheckedOrders(new Set()); 
                        setAddressMapping({}); setCashReceipts({}); setInventory(lockedItems); 
                        setManualDeposits([]); setNoShowCustomers({}); setWaitlistCustomers({}); setTrackingNumbers({});
                        window.dispatchEvent(new CustomEvent('clear-chats'));

                        // 2순위: 파이어베이스 마감 상태 반영
                        if (window.emberRealtimeDb) {
                            const safePrevKey = prevBroadcastTitle.replace(/[.#$\[\]\/]/g, '_');
                            if (safePrevKey && closedPortalCustomers.length > 0) {
                                window.emberRealtimeDb.ref(`ember_live_data/_portal_orders/${safePrevKey}`).set({
                                    broadcastName: prevBroadcastTitle,
                                    updatedAt: Date.now(),
                                    updatedBy: 'boss_closed',
                                    customers: closedPortalCustomers
                                }).catch(() => {});
                            }
                            window.emberRealtimeDb.ref('ember_live_data/_portal_live_mode').set({
                                isLive: false,
                                liveOwner: 'none',
                                lastClosedBroadcastName: prevBroadcastTitle,
                                updatedAt: Date.now()
                            }).catch(() => {});
                            window.emberRealtimeDb.ref('ember_live_data/_portal_orders/__MAIN_LIVE__').remove().catch(() => {});
                            window.emberRealtimeDb.ref('ember_live_data').update({
                                '_global_config/catalogClosedLock': true,
                                '_global_config/isStoreClosed': true,
                                '_global_config/currentPinnedId': null,
                                '_live_catalog': {
                                    items: [],
                                    rawCount: 0,
                                    explicitClear: true,
                                    updatedAt: Date.now()
                                }
                            }).catch(() => {});
                        }

                        // 3순위: 구글 시트에 '주문_방송이름' 마감 시트 생성 및 '메인주문'/'실시간재고' 초기화
                        if (googleScriptUrl && masterSheetId) {
                            const cleanMaster = getCleanSheetId(masterSheetId);
                            const invPayload = lockedItems.length > 0
                                ? lockedItems.map(i => ({ name: i.name, price: i.price, stock: i.stock !== undefined ? i.stock : '', status: i.isSoldOut ? '품절' : '', isLocked: Boolean(i.isLocked) }))
                                : [{ name: '__EMPTY__', price: 0, stock: '', status: '품절', isLocked: false }];
                            const emptyOrderList = [{
                                '닉네임': '___WORKSPACE_META___',
                                '주문자': '___WORKSPACE_META___',
                                customer: '___WORKSPACE_META___',
                                nickname: '___WORKSPACE_META___',
                                name: '___WORKSPACE_META___',
                                '상품명': nextTitle,
                                product: nextTitle,
                                '수량': Number(freeShippingThreshold) || 70000,
                                quantity: Number(freeShippingThreshold) || 70000,
                                qty: Number(freeShippingThreshold) || 70000,
                                '단가(제품금액)': Number(quickShipping) || 4000,
                                price: Number(quickShipping) || 4000,
                                '배송비': feeRateNumNow,
                                shipping: feeRateNumNow,
                                '입금액': 0,
                                deposit: 0,
                                '카드결제': '',
                                '수령인명': '',
                                '연락처': '',
                                '주소': '',
                                '요청사항': '',
                                'VIP여부': '',
                                '노쇼여부': '',
                                '대기여부': '',
                                '비밀번호': '',
                                '주문확인': '',
                                '입금내역JSON': '',
                                '송장번호': ''
                            }];
                            try {
                                if (savedChatsSnapshot.length > 0) {
                                    const chatRowsToArchive = savedChatsSnapshot.map(c => [
                                        c.time ? `[${prevBroadcastTitle}] ${c.time}` : prevBroadcastTitle,
                                        c.nickname || '',
                                        c.content || ''
                                    ]);
                                    await fetchGas(googleScriptUrl, {
                                        action: 'save_chats',
                                        masterId: cleanMaster,
                                        broadcastName: prevBroadcastTitle,
                                        data: chatRowsToArchive
                                    });
                                }
                                if (prevBroadcastTitle && activePrevOrders.length > 0) {
                                    await fetchGas(googleScriptUrl, {
                                        action: 'save_orders',
                                        masterId: cleanMaster,
                                        targetSheetName: archiveSheetName,
                                        onlyMainOrder: true,
                                        broadcastName: prevBroadcastTitle,
                                        data: prevArchiveRows
                                    });
                                }
                                await fetchGas(googleScriptUrl, { action: 'save_inventory', masterId: cleanMaster, forceClear: true, data: invPayload });
                                await fetchGas(googleScriptUrl, { action: 'save_orders', masterId: cleanMaster, targetSheetName: '메인주문', broadcastName: nextTitle, onlyMainOrder: true, data: emptyOrderList, nicknames: [], confirmedNicknames: [] });
                            } catch (e) {}
                        }

                        setTimeout(() => {
                            openModal(`✅ 내 시트에 [${archiveSheetName}] 시트 및 [채팅기록] 저장과 방송 마감이 완료되었습니다!`, 'alert');
                        }, 100);
                    },
                    null,
                    defaultClosingTitle
                );
            };

            const handleExportBackup = () => {
                const backupData = {
                    orders, productHistory, shippingOverrides, addresses, cardPayments, cashReceipts, manualDeposits, matchedDeposits: [...matchedDeposits], depositLinks, customerDepositLogs, depositorNames, clickedChats: [...clickedChats],
                    keywords, sentAddressRequests: [...sentAddressRequests], deletedDepositIds: [...deletedDepositIds], checkedOrders: [...checkedOrders], addressMapping, specialCustomers, inventory,
                    noShowCustomers, waitlistCustomers, trackingNumbers, customerCredits, quickMessages, settings: {
                        googleScriptUrl, youtubeApiKey, youtubeVideoId, depSheetId, addrSheetId, masterSheetId, broadcastName, quickShipping, jejuShipping, freeShippingThreshold, cardFeeRate, templateConfig, bankAccount, addressStartDate, soundVolume
                    }, timestamp: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `주문관리_백업_${new Date().toLocaleDateString()}.json`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            };

            const handleImportBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        openModal('백업 데이터를 복구하시겠습니까?\n현재 데이터는 덮어씌워집니다.', 'confirm', () => {
                            if (data.orders) setOrders(data.orders);
                            if (data.productHistory) setProductHistory(data.productHistory);
                            if (data.shippingOverrides) setShippingOverrides(data.shippingOverrides);
                            if (data.addresses) setAddresses(data.addresses);
                            if (data.cardPayments) setCardPayments(data.cardPayments);
                            if (data.cashReceipts) setCashReceipts(data.cashReceipts);
                            if (data.manualDeposits) setManualDeposits(data.manualDeposits);
                            if (data.matchedDeposits) setMatchedDeposits(new Set(data.matchedDeposits));
                            if (data.depositLinks) setDepositLinks(data.depositLinks);
                            if (data.customerDepositLogs) setCustomerDepositLogs(data.customerDepositLogs);
                            if (data.depositorNames) setDepositorNames(data.depositorNames);
                            if (data.clickedChats) setClickedChats(new Set(data.clickedChats));
                            if (data.keywords) setKeywords(data.keywords);
                            if (data.sentAddressRequests) setSentAddressRequests(new Set(data.sentAddressRequests));
                            if (data.deletedDepositIds) setDeletedDepositIds(new Set(data.deletedDepositIds));
                            if (data.checkedOrders) setCheckedOrders(new Set(data.checkedOrders));
                            if (data.addressMapping) setAddressMapping(data.addressMapping);
                            if (data.specialCustomers) setSpecialCustomers(data.specialCustomers);
                            if (data.inventory) setInventory(data.inventory);
                            if (data.noShowCustomers) setNoShowCustomers(data.noShowCustomers);
                            if (data.waitlistCustomers) setWaitlistCustomers(data.waitlistCustomers);
                            if (data.trackingNumbers) setTrackingNumbers(data.trackingNumbers);
                            if (data.customerCredits) setCustomerCredits(data.customerCredits);
                            if (data.quickMessages) setQuickMessages(data.quickMessages);
                            
                            if (data.settings) {
                                if(data.settings.googleScriptUrl) setGoogleScriptUrl(data.settings.googleScriptUrl);
                                if(data.settings.youtubeApiKey) setYoutubeApiKey(data.settings.youtubeApiKey);
                                if(data.settings.youtubeVideoId) setYoutubeVideoId(data.settings.youtubeVideoId);
                                if(data.settings.depSheetId) setDepSheetId(data.settings.depSheetId);
                                if(data.settings.addrSheetId) setAddrSheetId(data.settings.addrSheetId);
                                if(data.settings.masterSheetId) setMasterSheetId(data.settings.masterSheetId);
                                if(data.settings.broadcastName) setBroadcastName(data.settings.broadcastName);
                                if(data.settings.quickShipping !== undefined) setQuickShipping(data.settings.quickShipping);
                                if(data.settings.jejuShipping !== undefined) setJejuShipping(data.settings.jejuShipping);
                                if(data.settings.freeShippingThreshold !== undefined) setFreeShippingThreshold(data.settings.freeShippingThreshold);
                                if(data.settings.cardFeeRate !== undefined) setCardFeeRate(data.settings.cardFeeRate);
                                if(data.settings.templateConfig) setTemplateConfig(data.settings.templateConfig);
                                if(data.settings.bankAccount) setBankAccount(data.settings.bankAccount);
                                if(data.settings.addressStartDate) setAddressStartDate(data.settings.addressStartDate);
                                if(data.settings.soundVolume !== undefined) setSoundVolume(data.settings.soundVolume);
                            }
                            openModal('백업 데이터 복구가 완료되었습니다.', 'alert');
                        });
                    } catch (error) {
                        openModal('잘못된 백업 파일입니다.', 'alert');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            return (
                <div className={`h-screen flex flex-col ${isDarkMode ? 'dark' : ''} text-slate-800 dark:text-slate-100 bg-slate-50 dark:bg-slate-900 overflow-hidden`}>
                    {globalError && (
                        <div className="bg-red-500 text-white text-xs py-1 px-4 text-center font-bold shadow-md relative z-50 flex items-center justify-center gap-2">
                            <span>{globalError}</span>
                            <button onClick={()=>setGlobalError('')} className="ml-2 bg-red-700 px-2 py-0.5 rounded hover:bg-red-800 transition-colors">닫기</button>
                        </div>
                    )}
                    
                    <div className="bg-white dark:bg-slate-800 border-b dark:border-slate-700 shadow-sm px-4 py-2 flex justify-between items-center z-10 shrink-0">
                        <div className="flex items-center gap-3">
                            <h1 className="text-xl font-black tracking-tight text-slate-800 dark:text-white flex items-center gap-2"><Icon name="shopping-bag" weight="fill" className="text-blue-500" /> 강은지 주문서</h1>
                            <div className="flex bg-slate-100 dark:bg-slate-900 rounded-lg p-1 ml-4 shadow-inner border dark:border-slate-700 items-center">
                                <button onClick={() => setActiveTab('live')} className={`px-4 py-1.5 rounded-md text-sm font-bold transition-all ${activeTab === 'live' ? 'bg-white dark:bg-slate-700 shadow-sm text-blue-600 dark:text-blue-400 border border-slate-200 dark:border-slate-600' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200'}`}><Icon name="broadcast" weight={activeTab === 'live' ? 'fill' : 'regular'} className="inline-block mr-1"/> 라이브</button>
                                <button onClick={() => setActiveTab('management')} className={`px-4 py-1.5 rounded-md text-sm font-bold transition-all ${activeTab === 'management' ? 'bg-white dark:bg-slate-700 shadow-sm text-blue-600 dark:text-blue-400 border border-slate-200 dark:border-slate-600' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200'}`}><Icon name="kanban" weight={activeTab === 'management' ? 'fill' : 'regular'} className="inline-block mr-1"/> 정산 / 내보내기</button>
                                <div className="w-px h-4 bg-slate-300 dark:bg-slate-600 mx-1.5"></div>
                                <button onClick={() => window.dispatchEvent(new CustomEvent('force-sync'))} className="px-3 py-1.5 rounded-md text-sm font-bold text-slate-500 hover:text-blue-600 dark:text-slate-400 dark:hover:text-blue-400 transition-colors flex items-center gap-1" title="데이터 즉시 동기화 (단축키: Alt + R)">
                                    <Icon name="arrows-clockwise" weight="bold" /> 새로고침
                                </button>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setIsNoticeModalOpen(true)} className={`px-2.5 py-1.5 rounded-full transition-colors flex items-center gap-1 border shadow-sm text-xs font-extrabold ${customerNotice.enabled ? 'bg-amber-400 border-amber-500 text-slate-900' : 'bg-slate-100 border-slate-200 text-slate-600 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300'}`} title="고객용 포털 & 라인업 공지사항 팝업 설정">
                                <Icon name="megaphone" weight="fill" size={15} />
                                <span>공지 {customerNotice.enabled ? 'ON' : 'OFF'}</span>
                            </button>
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className={`p-2 rounded-full transition-colors flex items-center justify-center border shadow-sm ${soundEnabled ? 'bg-blue-50 border-blue-200 text-blue-600 dark:bg-blue-900/30 dark:border-blue-700/50 dark:text-blue-400' : 'bg-slate-100 border-slate-200 text-slate-400 dark:bg-slate-800 dark:border-slate-700'}`} title={soundEnabled ? "알림음 켜짐" : "알림음 꺼짐"}><Icon name={soundEnabled ? "speaker-high" : "speaker-slash"} weight="fill" size={18} /></button>
                            <button onClick={() => setIsStatusModalOpen(true)} className="p-2 bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-800/50 hover:bg-blue-100 dark:hover:bg-blue-900/40 rounded-full transition-colors flex items-center justify-center shadow-sm" title="통합 고객상태 관리 (VIP, 노쇼, 관리자)"><Icon name="users-three" weight="fill" size={18} /></button>
                    <button onClick={() => setIsSettingsOpen(!isSettingsOpen)} className="p-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition-colors flex items-center justify-center shadow-sm" title="환경설정"><Icon name="gear" weight="fill" size={18} /></button>
                    <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition-colors flex items-center justify-center shadow-sm" title={isDarkMode ? "라이트 모드로 전환" : "다크 모드로 전환"}><Icon name={isDarkMode ? "sun" : "moon"} weight="fill" size={18} /></button>
                </div>
            </div>

            {isNoticeModalOpen && (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999]" onClick={() => setIsNoticeModalOpen(false)}>
                    <div className="bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-5 w-full max-w-md mx-4" onClick={e => e.stopPropagation()}>
                        <div className="mb-3 border-b dark:border-slate-700 pb-2.5 flex justify-between items-center">
                            <h3 className="text-base font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                <Icon name="megaphone" weight="fill" className="text-amber-500" /> 고객용 공지사항 팝업 관리
                            </h3>
                            <button onClick={() => setIsNoticeModalOpen(false)} className="text-slate-400 hover:text-slate-600"><Icon name="x" weight="bold" size={20}/></button>
                        </div>
                        <form onSubmit={handleSaveCustomerNotice} className="space-y-3 text-xs">
                            <div className="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-900 rounded-lg border dark:border-slate-700">
                                <span className="font-bold text-slate-700 dark:text-slate-200">고객 포털 & 라인업 접속 시 팝업 띄우기</span>
                                <button
                                    type="button"
                                    onClick={() => setCustomerNotice(p => ({ ...p, enabled: !p.enabled }))}
                                    className={`px-3 py-1 rounded font-extrabold transition ${customerNotice.enabled ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-300'}`}
                                >
                                    {customerNotice.enabled ? '🟢 팝업 켜짐 (ON)' : '⚫ 팝업 꺼짐 (OFF)'}
                                </button>
                            </div>
                            <div>
                                <label className="block font-bold text-slate-600 dark:text-slate-300 mb-1">공지 제목</label>
                                <input
                                    type="text"
                                    value={customerNotice.title}
                                    onChange={e => setCustomerNotice(p => ({ ...p, title: e.target.value }))}
                                    placeholder="📢 엠버언니 공지사항"
                                    className="w-full border dark:border-slate-600 rounded px-3 py-2 bg-slate-50 dark:bg-slate-900 dark:text-white font-bold outline-none"
                                />
                            </div>
                            <div>
                                <label className="block font-bold text-slate-600 dark:text-slate-300 mb-1">공지 내용 (줄바꿈 지원)</label>
                                <textarea
                                    value={customerNotice.content}
                                    onChange={e => setCustomerNotice(p => ({ ...p, content: e.target.value }))}
                                    placeholder="고객분들께 안내할 배송 일정, 휴무, 이벤트 등의 공지 내용을 입력해 주세요."
                                    rows={6}
                                    className="w-full border dark:border-slate-600 rounded px-3 py-2 bg-slate-50 dark:bg-slate-900 dark:text-white font-semibold outline-none resize-y leading-relaxed"
                                />
                            </div>
                            <div className="flex gap-2 pt-2">
                                <button type="button" onClick={() => setIsNoticeModalOpen(false)} className="flex-1 py-2.5 rounded font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">취소</button>
                                <button type="submit" className="flex-1 py-2.5 rounded font-bold bg-blue-600 hover:bg-blue-700 text-white shadow-sm">저장 및 즉시 반영</button>
                            </div>
                        </form>
                    </div>
                </div>
            )}

            {isSettingsOpen && <SettingsModalContent youtubeApiKey={youtubeApiKey} setYoutubeApiKey={setYoutubeApiKey} youtubeVideoId={youtubeVideoId} setYoutubeVideoId={setYoutubeVideoId} googleScriptUrl={googleScriptUrl} setGoogleScriptUrl={setGoogleScriptUrl} depSheetId={depSheetId} setDepSheetId={setDepSheetId} addrSheetId={addrSheetId} setAddrSheetId={setAddrSheetId} masterSheetId={masterSheetId} setMasterSheetId={setMasterSheetId} broadcastName={broadcastName} setBroadcastName={setBroadcastName} quickShipping={quickShipping} setQuickShipping={setQuickShipping} jejuShipping={jejuShipping} setJejuShipping={setJejuShipping} freeShippingThreshold={freeShippingThreshold} setFreeShippingThreshold={setFreeShippingThreshold} cardFeeRate={cardFeeRate} setCardFeeRate={setCardFeeRate} templateConfig={templateConfig} setTemplateConfig={setTemplateConfig} bankAccount={bankAccount} setBankAccount={setBankAccount} quickMessages={quickMessages} setQuickMessages={setQuickMessages} addressStartDate={addressStartDate} setAddressStartDate={setAddressStartDate} soundVolume={soundVolume} setSoundVolume={setSoundVolume} staffAccessPasscode={staffAccessPasscode} setStaffAccessPasscode={setStaffAccessPasscode} setIsSettingsOpen={setIsSettingsOpen} />}

            <div className="flex-1 overflow-hidden flex flex-col">
                <div className={`flex-1 overflow-hidden ${activeTab === 'live' ? 'flex' : 'hidden'}`}>
                    <LiveTab youtubeApiKey={youtubeApiKey} youtubeVideoId={youtubeVideoId} orders={orders} setOrders={setOrders} productHistory={productHistory} setProductHistory={setProductHistory} quickShipping={quickShipping} jejuShipping={jejuShipping} freeShippingThreshold={freeShippingThreshold} cardFeeRate={cardFeeRate} shippingOverrides={shippingOverrides} setShippingOverrides={setShippingOverrides} bankAccount={bankAccount} googleScriptUrl={googleScriptUrl} setGoogleScriptUrl={setGoogleScriptUrl} depSheetId={depSheetId} masterSheetId={masterSheetId} addresses={addresses} setAddresses={setAddresses} cardPayments={cardPayments} setCardPayments={setCardPayments} manualDeposits={manualDeposits} setManualDeposits={setManualDeposits} matchedDeposits={matchedDeposits} setMatchedDeposits={setMatchedDeposits} depositLinks={depositLinks} setDepositLinks={setDepositLinks} customerDepositLogs={customerDepositLogs} setCustomerDepositLogs={setCustomerDepositLogs} depositorNames={depositorNames} setDepositorNames={setDepositorNames} clickedChats={clickedChats} setClickedChats={setClickedChats} openModal={openModal} keywords={keywords} setKeywords={setKeywords} sentAddressRequests={sentAddressRequests} setSentAddressRequests={setSentAddressRequests} deletedDepositIds={deletedDepositIds} setDeletedDepositIds={setDeletedDepositIds} checkedOrders={checkedOrders} setCheckedOrders={setCheckedOrders} addressMapping={addressMapping} setAddressMapping={setAddressMapping} templateConfig={templateConfig} specialCustomers={specialCustomers} setSpecialCustomers={setSpecialCustomers} inventory={inventory} setInventory={setInventory} quickMessages={quickMessages} handleResetAllData={handleResetAllData} broadcastName={broadcastName} setBroadcastName={setBroadcastName} setGlobalError={setGlobalError} cashReceipts={cashReceipts} setCashReceipts={setCashReceipts} soundEnabled={soundEnabled} soundVolume={soundVolume} noShowCustomers={noShowCustomers} setNoShowCustomers={setNoShowCustomers} waitlistCustomers={waitlistCustomers} setWaitlistCustomers={setWaitlistCustomers} customerPasswords={customerPasswords} setCustomerPasswords={setCustomerPasswords} trackingNumbers={trackingNumbers} setTrackingNumbers={setTrackingNumbers} customerCredits={customerCredits} setCustomerCredits={setCustomerCredits} isLiveBroadcasting={isLiveBroadcasting} setIsLiveBroadcasting={setIsLiveBroadcasting} />
                </div>
                <div className={`flex-1 overflow-y-auto ${activeTab === 'management' ? 'block' : 'hidden'}`}>
                    <OrderManagementTab orders={orders} shippingOverrides={shippingOverrides} quickShipping={quickShipping} jejuShipping={jejuShipping} freeShippingThreshold={freeShippingThreshold} cardFeeRate={cardFeeRate} broadcastName={broadcastName} addresses={addresses} handleExportBackup={handleExportBackup} handleImportBackup={handleImportBackup} addressMapping={addressMapping} cardPayments={cardPayments} specialCustomers={specialCustomers} openModal={openModal} cashReceipts={cashReceipts} inventory={inventory} productHistory={productHistory} noShowCustomers={noShowCustomers} waitlistCustomers={waitlistCustomers} trackingNumbers={trackingNumbers} setTrackingNumbers={setTrackingNumbers} googleScriptUrl={googleScriptUrl} masterSheetId={masterSheetId} />
                </div>
            </div>

            <Modal isOpen={modalConfig.isOpen} type={modalConfig.type} message={modalConfig.message} onConfirm={modalConfig.onConfirm} onCancel={modalConfig.onCancel} initialValue={modalConfig.initialValue} />
            <CustomerStatusModal isOpen={isStatusModalOpen} onClose={() => setIsStatusModalOpen(false)} specialCustomers={specialCustomers} setSpecialCustomers={setSpecialCustomers} googleScriptUrl={googleScriptUrl} masterSheetId={masterSheetId} openModal={openModal} />
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
