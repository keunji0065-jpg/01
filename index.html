        // Babel 500KB deoptimised 스타일 경고 및 외부 스크립트 오류 완전 차단
        (function() {
            const origWarn = console.warn;
            const origError = console.error;
            console.warn = function(...args) {
                const msg = args.map(a => String(a || '')).join(' ');
                if (msg.includes('500KB') || msg.includes('deoptimised') || msg.includes('Tailwind') || msg.includes('babel')) return;
                return origWarn.apply(console, args);
            };
            console.error = function(...args) {
                const msg = args.map(a => String(a || '')).join(' ');
                if (msg.includes('500KB') || msg.includes('deoptimised') || msg.includes('Script error')) return;
                return origError.apply(console, args);
            };
            window.addEventListener('error', function(e) {
                if (!e.message || e.message === 'Script error.' || (e.filename && e.filename.includes('google.com'))) {
                    e.preventDefault();
                    return true;
                }
            }, true);
            window.addEventListener('unhandledrejection', function(e) {
                e.preventDefault();
            });
        })();
    </script>

                apiKey: "AIzaSyDgdH34cDnp2S9akHfFLYBSpHzzamHFuoc",

            };
            if (!firebase.apps.length) {
                firebase.initializeApp(emberFbConfig);
            }
            window.emberRealtimeDb = firebase.database();
        } catch (e) {}

        // 강은지 주문서에서 재고(상품)가 추가/수정/품절될 때 고객용 라인업(Firebase)에도 0.1초 만에 즉시 반영하는 헬퍼 함수
        window.pushInventoryToLiveCatalog = function(invList) {
            if (!window.emberRealtimeDb || !Array.isArray(invList)) return;
            try {
                const getSafeKey = (name) => String(name || '').replace(/[.#$\[\]]/g, '_');
                const validRows = [];
                invList.forEach(item => {
                    const name = String(item.name || '').trim();
                    if (!name || name === '__EMPTY__') return;
                    const priceNum = Number(item.price) || 0;
                    if (priceNum <= 0) return;
                    validRows.push({
                        originalName: name,
                        isSoldOut: Boolean(item.isSoldOut),
                        numericPrice: priceNum,
                        formattedPrice: priceNum.toLocaleString(),
                        sheetVideoCol: ''
                    });
                });

                const extractItemGroupKey = (name, price) => {
                    const trimmed = String(name || '').trim();
                    const numStart = trimmed.match(/^(\d+(?:-\d+)?)/);
                    if (numStart) return `${numStart[1]}_${price}`;
                    const prefixNum = trimmed.match(/^([a-zA-Z]+\s*\d+(?:-\d+)?)/);
                    if (prefixNum) return `${prefixNum[1].replace(/\s+/g, '').toUpperCase()}_${price}`;
                    const words = trimmed.split(/\s+/);
                    const baseKey = words.length >= 2 ? `${words[0]}_${words[1]}` : words[0];
                    return `${baseKey}_${price}`;
                };

                const groupMap = {};
                validRows.forEach(row => {
                    const groupKey = extractItemGroupKey(row.originalName, row.numericPrice);
                    if (!groupMap[groupKey]) groupMap[groupKey] = [];
                    groupMap[groupKey].push(row);
                });

                const finalGroups = [];
                for (const key in groupMap) {
                    const items = groupMap[key];
                    if (items.length === 1) {
                        finalGroups.push({
                            id: getSafeKey(items[0].originalName),
                            name: items[0].originalName,
                            formattedPrice: items[0].formattedPrice,
                            numericPrice: items[0].numericPrice,
                            sheetVideoCol: '',
                            options: [{
                                originalName: items[0].originalName,
                                displayName: '기본(단품)',
                                isSoldOut: items[0].isSoldOut,
                                numericPrice: items[0].numericPrice
                            }]
                        });
                        continue;
                    }
                    const splitItems = items.map(item => item.originalName.split(/\s+/));
                    const minLen = Math.min(...splitItems.map(arr => arr.length));
                    let commonWordCount = 0;
                    for (let i = 0; i < minLen; i++) {
                        const word = splitItems[0][i];
                        if (splitItems.every(arr => arr[i] === word)) commonWordCount++;
                        else break;
                    }
                    const commonPrefixStr = splitItems[0].slice(0, commonWordCount).join(' ').trim();
                    if (commonWordCount === 0 || /^[a-zA-Z]$/.test(commonPrefixStr)) {
                        items.forEach(singleItem => {
                            finalGroups.push({
                                id: getSafeKey(singleItem.originalName),
                                name: singleItem.originalName,
                                formattedPrice: singleItem.formattedPrice,
                                numericPrice: singleItem.numericPrice,
                                sheetVideoCol: '',
                                options: [{
                                    originalName: singleItem.originalName,
                                    displayName: '기본(단품)',
                                    isSoldOut: singleItem.isSoldOut,
                                    numericPrice: singleItem.numericPrice
                                }]
                            });
                        });
                        continue;
                    }
                    const baseName = commonPrefixStr;
                    const safeKey = getSafeKey(baseName);
                    const options = items.map((item, idx) => ({
                        originalName: item.originalName,
                        displayName: splitItems[idx].slice(commonWordCount).join(' ') || '기본(단품)',
                        isSoldOut: item.isSoldOut,
                        numericPrice: item.numericPrice
                    }));
                    finalGroups.push({
                        id: safeKey,
                        name: baseName,
                        formattedPrice: items[0].formattedPrice,
                        numericPrice: items[0].numericPrice,
                        sheetVideoCol: '',
                        options: options
                    });
                }

                const groupArray = finalGroups.sort((a, b) => {
                    const matchA = a.name.match(/^(?:[a-zA-Z]+\s*)?(\d+)(?:-(\d+))?/);
                    const matchB = b.name.match(/^(?:[a-zA-Z]+\s*)?(\d+)(?:-(\d+))?/);
                    const numA = matchA ? parseInt(matchA[1], 10) : -1;
                    const numB = matchB ? parseInt(matchB[1], 10) : -1;
                    if (numA === -1 && numB === -1) return a.name.localeCompare(b.name);
                    if (numA !== numB) return numB - numA;
                    const subA = matchA && matchA[2] ? parseInt(matchA[2], 10) : 0;
                    const subB = matchB && matchB[2] ? parseInt(matchB[2], 10) : 0;
                    return subB - subA;
                });

                // 강은지 주문서에서 상품을 등록/수정하면 마감 잠금도 함께 풀고 라인업(_live_catalog)에 즉시 덮어씌움!
                // 🛡️ 단, 빈 배열(validRows.length === 0)일 때는 다른 탭이 현재 방송 라인업을 지워버리지 못하도록 절대 전송하지 않음!
                if (validRows.length === 0) return;

                window.emberRealtimeDb.ref('ember_live_data').update({
                    '_global_config/catalogClosedLock': false,
                    '_global_config/isStoreClosed': false,
                    '_deleted_catalog_ids': null,
                    '_live_catalog': {
                        items: groupArray,
                        rawCount: validRows.length,
                        explicitClear: false,
                        updatedAt: Date.now()
                    }
                }).catch(() => {});
            } catch (e) {}
        };
    </script>

            // 유튜브의 다양한 URL 형태(youtu.be, youtube.com/watch, live 등)에서 11자리 ID만 추출
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|live\/))([\w-]{11})/);
            return match ? match[1] : url.trim();
        };

        const getChosung = (str) => {
            if (!str) return '';
            const safeStr = String(str);
            const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅇ","ㅆ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            let result = "";
            for (let i = 0; i < safeStr.length; i++) {
                const code = safeStr.charCodeAt(i) - 44032;
                if (code > -1 && code < 11172) result += cho[Math.floor(code / 588)];
                else result += safeStr.charAt(i);
            }
            return result;
        };

        const cleanForMatch = (str) => {
            if (!str) return '';
            let s = String(str).toLowerCase().replace(/\s/g, '');
            s = s.replace(/[—–−_]/g, '-');
            if (s.includes('-')) s = s.split('-')[0];
            // 끝에 붙은 '42번', '7번' 같은 상품번호 꼬리표 제거
            s = s.replace(/\d+번$/, '');
            s = s.replace(/[\(\)\[\]\{\}\.\,\/]/g, '');
            if (/[가-힣]/.test(s)) s = s.replace(/[a-z0-9]+$/, '');
            return s;
        };

        // ✨ 입금자명에서 가능한 모든 매칭 조각(괄호 안/밖 분리, 상품번호 제거, 한글 코어 추출)을 뽑아내는 스마트 분석 함수
        const extractDepositTokens = (rawStr) => {
            if (!rawStr) return { norms: [], cleans: [], kos: [] };
            let s = String(rawStr).trim();
            // 끝에 붙은 '42번', '11번' 등 상품번호 제거
            const withoutItemNo = s.replace(/\s*\d+\s*번$/g, '').trim();

            const parts = new Set([s, withoutItemNo]);

            // 1) 괄호 분리: "드리머(한재은)", "이호정(밤송이야)" -> "드리머", "한재은" 각각 분리!
            const parenMatch = withoutItemNo.match(/^([^\(\[\{]+)[\(\[\{]([^\)\]\}]+)[\)\]\}]$/);
            if (parenMatch) {
                if (parenMatch[1].trim()) parts.add(parenMatch[1].trim());
                if (parenMatch[2].trim()) parts.add(parenMatch[2].trim());
            }

            // 2) 슬래시, 하이픈, 공백 분리
            withoutItemNo.split(/[\/\,\-\s\(\)\[\]\{\}]+/).forEach(p => {
                if (p && p.trim().length >= 2) parts.add(p.trim());
            });

            const norms = new Set();
            const cleans = new Set();
            const kos = new Set();

            parts.forEach(p => {
                const n = normalizeString(p);
                const c = cleanForMatch(p);
                const k = extractKo(p);
                if (n && n.length >= 2) norms.add(n);
                if (c && c.length >= 2) cleans.add(c);
                if (k && k.length >= 2) kos.add(k);
            });

            return {
                norms: Array.from(norms),
                cleans: Array.from(cleans),
                kos: Array.from(kos),
                fullNorm: normalizeString(withoutItemNo),
                fullKo: extractKo(withoutItemNo)
            };
        };

    const extractKo = (str) => {
            if (!str) return '';
            return String(str).replace(/[^가-힣]/g, '');
        };

        // 유튜브 자동생성 핸들 꼬리표(-SD2 등 -영문숫자 1~10자)만 깔끔하게 제거하여 동일 고객 여부를 판별하는 함수
        const normalizeHandleNick = (str) => {
            if (!str) return '';
            let s = String(str).trim();
            s = s.replace(/-[a-zA-Z0-9_]{1,10}$/, '');
            return normalizeString(s);
        };

        // 주소 앞의 우편번호 '(06035) ' 자동 제거 (우편번호 미사용)
        const stripZipcodeFromAddr = (str) => {
            return String(str || '').replace(/^\(\d{5}\)\s*/, '').trim();
        };

        const fixPhoneNumber = (numStr) => {
            if (!numStr) return '';
            let cleaned = String(numStr).replace(/[^0-9]/g, '');
            if (cleaned.length === 10 && !cleaned.startsWith('0')) cleaned = '0' + cleaned;
            return cleaned;
        };

        const parseSafeDate = (val) => {
            if (!val) return new Date(0);
            const s = String(val).trim();
            
            // YYYYMMDD 형식
            if (/^\d{8}$/.test(s)) return new Date(parseInt(s.substring(0, 4)), parseInt(s.substring(4, 6)) - 1, parseInt(s.substring(6, 8)));
            // YYMMDD 형식
            if (/^\d{6}$/.test(s)) return new Date(2000 + parseInt(s.substring(0, 2)), parseInt(s.substring(2, 4)) - 1, parseInt(s.substring(4, 6)));

            // ✨ 구글 시트/엑셀 숫자형 일련번호(예: 45206.5) 처리 로직
            const numVal = Number(s);
            // 엑셀에서 30000은 대략 1982년, 60000은 2064년. 이 범위 내일 때만 일련번호로 취급하여 버그 방지
            if (!isNaN(numVal) && numVal > 30000 && numVal < 60000) {
                const d = new Date(1899, 11, 30);
                d.setDate(d.getDate() + Math.floor(numVal));
                if (!isNaN(d) && d.getTime() > 0) return d;
            }

            const match = s.match(/(\d{4})[./-]\s*(\d{1,2})[./-]\s*(\d{1,2})/);
            if (match) return new Date(parseInt(match[1]), parseInt(match[2])-1, parseInt(match[3]));
            
            // "10. 7" 또는 "10/7" 같은 올해 연도 생략 날짜 (구글폼에서 자주 발생)
            const shortMatch = s.match(/^(\d{1,2})[./-]\s*(\d{1,2})[./]?\s*$/);
            if (shortMatch) return new Date(new Date().getFullYear(), parseInt(shortMatch[1])-1, parseInt(shortMatch[2]));

            let d = new Date(s.replace(/-/g, '/')); // iOS Safari 크로스 브라우징 완벽 호환을 위한 슬래시 치환
            if (!isNaN(d) && d.getTime() > 0) return d;
            return new Date(0);
        };

        const formatDepositFullDateTime = (val) => {
            if (!val) return '';
            const strVal = String(val).trim();
            // 1. "2026. 10. 18 오후 4:26:46" 같은 한국어 날짜+시간 형태 -> "26-10-18 16:26"
            const korFullMatch = strVal.match(/(?:20)?(\d{2})[./-]\s*(\d{1,2})[./-]\s*(\d{1,2})[.\s]*(오전|오후|AM|PM)?\s*(\d{1,2}):(\d{2})/i);
            if (korFullMatch) {
                const yy = korFullMatch[1];
                const mm = String(korFullMatch[2]).padStart(2, '0');
                const dd = String(korFullMatch[3]).padStart(2, '0');
                const ampm = (korFullMatch[4] || '').toUpperCase();
                let hour = parseInt(korFullMatch[5], 10);
                const min = korFullMatch[6];
                if ((ampm === '오후' || ampm === 'PM') && hour < 12) hour += 12;
                else if ((ampm === '오전' || ampm === 'AM') && hour === 12) hour = 0;
                return `${yy}-${mm}-${dd} ${String(hour).padStart(2, '0')}:${min}`;
            }
            // 2. ISO 문자열 -> KST "YY-MM-DD HH:MM"
            const dt = new Date(strVal);
            if (!isNaN(dt.getTime()) && strVal.length > 8) {
                const kst = new Date(dt.getTime() + (9 * 60 * 60 * 1000));
                const yy = String(kst.getUTCFullYear()).slice(-2);
                const mm = String(kst.getUTCMonth() + 1).padStart(2, '0');
                const dd = String(kst.getUTCDate()).padStart(2, '0');
                const hh = String(kst.getUTCHours()).padStart(2, '0');
                const min = String(kst.getUTCMinutes()).padStart(2, '0');
                return `${yy}-${mm}-${dd} ${hh}:${min}`;
            }
            return strVal;
        };

        const formatTimeOnly = (val) => { 
            if (!val) return ''; 
            const strVal = String(val).trim(); 
            // 1. "2026. 10. 18 오후 3:27:27" 또는 "오후 3:27"처럼 한국어 오전/오후가 포함된 경우 최우선 처리
            const korTimeMatch = strVal.match(/(오전|오후|AM|PM)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/i);
            if (korTimeMatch && (strVal.includes('오전') || strVal.includes('오후') || /\b(AM|PM)\b/i.test(strVal) || !strVal.includes('T'))) {
                let ampm = (korTimeMatch[1] || '').toUpperCase();
                let hour = parseInt(korTimeMatch[2], 10);
                const min = korTimeMatch[3];
                if ((ampm === '오후' || ampm === 'PM') && hour < 12) hour += 12;
                else if ((ampm === '오전' || ampm === 'AM') && hour === 12) hour = 0;
                return `${String(hour).padStart(2, '0')}:${min}`;
            }
            // 2. ISO 문자열 (예: "2026-10-18T06:27:27.000Z") 처리 -> 한국 시간(KST) 변환
            const dt = new Date(strVal);
            if (!isNaN(dt.getTime()) && strVal.length > 8) {
                return dt.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Seoul' });
            }
            return strVal; 
        };

        const fetchGas = async (url, payload = null, timeoutMs = 25000, retries = 2) => {
            const attempt = async () => {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                const options = { method: payload ? 'POST' : 'GET', redirect: "follow", signal: controller.signal };
                if (payload) {
                    options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
                    options.body = JSON.stringify(payload);
                }
                try {
                    const response = await fetch(url, options);
                    clearTimeout(timer);
                    const text = await response.text();
                    if (text.includes("<!DOCTYPE") || text.includes("<html")) {
                        throw new Error("앱스 스크립트 응답 지연 또는 권한 확인 필요");
                    }
                    return JSON.parse(text);
                } catch (err) {
                    clearTimeout(timer);
                    throw err;
                }
            };

            for (let i = 0; i <= retries; i++) {
                try {
                    return await attempt();
                } catch (err) {
                    if (i < retries) {
                        await new Promise(r => setTimeout(r, 600 * (i + 1)));
                        continue;
                    }
                    // POST 저장 요청의 경우 CORS 리다이렉트 등으로 응답 읽기만 막힌 경우에도 no-cors로 시트 기록을 끝까지 보장!
                    if (payload) {
                        try {
                            await fetch(url, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                body: JSON.stringify(payload)
                            });
                            return { status: "success", success: true, fallbackNoCors: true };
                        } catch (noCorsErr) {}
                    }
                    if (err && err.name === 'AbortError') {
                        return { status: "error", message: "응답 지연 (자동 재시도중)" };
                    }
                    return { status: "error", message: `통신 오류 (${err.message})` };
                }
            }
        };

        const generateSmartGroups = (inventory) => {
            const available = (inventory || []).filter(i => !i.isSoldOut);
            const byPrice = {};
            available.forEach(item => {
                if (!byPrice[item.price]) byPrice[item.price] = [];
                byPrice[item.price].push(item);
            });
            const groups = [];
            Object.values(byPrice).forEach(items => {
                const clusters = {};
                items.forEach(item => {
                    const words = String(item.name).trim().split(/\s+/);
                    // 첫 단어가 숫자/코드 기호로 시작하면 최소 2단어를 기본 상품명 그룹키로 잡음
                    const minLen = (words[0] && /\d/.test(words[0])) ? 2 : 1;
                    const clusterKey = words.slice(0, minLen).join(' ');
                    if (!clusters[clusterKey]) clusters[clusterKey] = [];
                    clusters[clusterKey].push({ name: item.name, words });
                });
                Object.values(clusters).forEach(clusterItems => {
                    if (clusterItems.length === 1) {
                        groups.push({ baseName: clusterItems[0].name, price: items[0].price, options: [], rawNames: [clusterItems[0].name] });
                        return;
                    }
                    // 그룹 내 모든 상품명 단어들을 비교하여 완벽하게 일치하는 앞부분(LCP) 추출
                    let lcp = [];
                    const first = clusterItems[0].words;
                    for (let i = 0; i < first.length; i++) {
                        const word = first[i];
                        if (clusterItems.every(ci => ci.words[i] === word)) { lcp.push(word); } else { break; }
                    }
                    // 열(Column) 단위로 옵션 수집하여 색상은 색상끼리, 사이즈는 사이즈끼리 모이도록 처리
                    const allOptions = [];
                    let maxLen = Math.max(...clusterItems.map(ci => ci.words.length));
                    for (let i = lcp.length; i < maxLen; i++) {
                        clusterItems.forEach(ci => {
                            const w = ci.words[i];
                            if (w && !allOptions.includes(w)) {
                                allOptions.push(w);
                            }
                        });
                    }
                    groups.push({ baseName: lcp.join(' '), price: items[0].price, options: allOptions, rawNames: clusterItems.map(ci => ci.name) });
                });
            });
            groups.sort((a, b) => String(b.baseName).localeCompare(String(a.baseName), 'ko-KR', {numeric: true}));
            return groups;
        };

        const useLocalStorage = (key, initialValue) => {
            const actualKey = getLsKey(key);
            const [storedValue, setStoredValue] = useState(() => {
                try { const item = window.localStorage.getItem(actualKey); return item ? JSON.parse(item) : initialValue; } catch (error) { return initialValue; }
            });
            useEffect(() => {
                const timer = setTimeout(() => { try { window.localStorage.setItem(actualKey, JSON.stringify(storedValue)); } catch(e) {} }, 800);
                return () => clearTimeout(timer);
            }, [actualKey, storedValue]);
            const setValue = useCallback((value) => { try { setStoredValue(prev => value instanceof Function ? value(prev) : value); } catch (error) {} }, []);
            return [storedValue, setValue];
        };

        const useResizablePanel = (id, defaultWidth) => {
            const lsKey = getLsKey(`panel_width_${id}`);
            const [width, setWidth] = useState(() => window.localStorage.getItem(lsKey) || defaultWidth);
            const ref = useRef(null);
            const timerRef = useRef(null);

            useEffect(() => {
                const target = ref.current;
                if (!target) return;
                const observer = new ResizeObserver(() => {
                    if (target.style.width && target.style.width !== width) {
                        clearTimeout(timerRef.current);
                        timerRef.current = setTimeout(() => {
                            const newWidth = target.style.width;
                            setWidth(newWidth);
                            window.localStorage.setItem(lsKey, newWidth);
                        }, 200);
                    }
                });
                observer.observe(target);
                return () => {
                    observer.disconnect();
                    clearTimeout(timerRef.current);
                };
            }, [lsKey, width]);

            return { ref, width };
        };

                            e.preventDefault(); 
                            e.stopPropagation(); 
                            onConfirm();

                window.addEventListener('keydown', handleKeyDown, true);

            }, [isOpen, type, onConfirm, onCancel]);    
          
            useEffect(() => {

                    if (type === 'prompt' && inputRef.current) {

                        </div>
                        {type === 'prompt' && (
                            <input ref={inputRef} type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} className="w-full border dark:border-slate-600 rounded-lg px-3 py-2 mb-5 text-sm focus:ring-2 focus:ring-slate-500 outline-none bg-slate-50 dark:bg-slate-900 dark:text-slate-100"/>
                        )}
                        <div className="flex gap-2">
                            {type !== 'alert' && <button onClick={onCancel} className="flex-1 py-2.5 rounded-lg text-sm font-bold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">취소</button>}
                            <button ref={confirmBtnRef} onClick={() => type === 'prompt' ? onConfirm(inputValue) : onConfirm()} className="flex-1 py-2.5 rounded-lg text-sm font-bold text-white bg-slate-700 hover:bg-slate-800 transition-colors shadow-sm focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 dark:focus:ring-offset-slate-800 outline-none">확인</button>

useEffect(() => {

            return (

                        <div className="mb-3 border-b dark:border-slate-700 pb-2 flex justify-between items-center shrink-0">

                                    const isSelected = selectedItems[item.name] > 0;
                                    const qty = selectedItems[item.name] || 0;
                                    return (
                                        <div key={item.id || item.name} className={`flex items-center justify-between p-2 rounded-lg border transition-all ${isSelected ? 'bg-blue-50 dark:bg-blue-900/30 border-blue-200 dark:border-blue-700 ring-1 ring-blue-200' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-blue-300'}`}>
                                            <div className="flex-1 min-w-0 pr-2">
                                                <div className={`font-bold text-sm truncate ${isSelected ? 'text-blue-700 dark:text-blue-300' : 'text-slate-800 dark:text-slate-200'}`}>
                                                    {item.name} {item.isSoldOut && <span className="ml-1 text-[10px] bg-red-500 text-white px-1 py-0.5 rounded font-bold shadow-sm">품절</span>}
                                                </div>
                                                <div className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                                                    단가: {Number(item.price).toLocaleString()}원 | 총재고: {item.stock !== undefined && item.stock !== '' ? item.stock : '∞'}
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2 shrink-0">
                                                <button 
                                                    onClick={() => setSelectedItems(prev => ({...prev, [item.name]: Math.max(0, (prev[item.name]||0)-1)}))}
                                                    className="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 flex items-center justify-center font-bold transition-colors"
                                                ><Icon name="minus" weight="bold"/></button>
                                                <span className="w-4 text-center font-bold text-sm dark:text-white">{qty}</span>
                                                <button 
                                                    onClick={() => setSelectedItems(prev => ({...prev, [item.name]: (prev[item.name]||0)+1}))}
                                                    className="w-7 h-7 rounded-full bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 hover:bg-blue-200 flex items-center justify-center font-bold transition-colors"
                                                ><Icon name="plus" weight="bold"/></button>
                                            </div>
                                        </div>
                                    )
                                })
                            )}
                        </div>

                        <div className="mt-2 pt-3 border-t dark:border-slate-700 shrink-0">
                            <button 
                                onClick={handleAdd}
                                disabled={totalQty === 0}
                                className={`w-full py-3 rounded-lg font-bold text-sm transition-colors flex justify-center items-center gap-2 shadow-sm ${totalQty > 0 ? 'bg-blue-600 hover:bg-blue-700 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-400 dark:text-slate-500 cursor-not-allowed'}`}
                            >
                                {totalQty > 0 ? `총 ${totalQty}개 일괄 추가하기` : '상품을 선택해주세요'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const QuickAddressModal = ({ isOpen, nick, initialData, onClose, onSubmit, openModal }) => {
            const [formData, setFormData] = useState({ realname: '', phone: '', address: '', detailAddress: '', memo: '' });
            const detailRef = useRef(null);

            useEffect(() => {
                if (isOpen) {
                    if (initialData) { setFormData({ realname: initialData.realname || '', phone: initialData.phone || '', address: stripZipcodeFromAddr(initialData.address || ''), detailAddress: '', memo: initialData.memo || '' }); } 
                    else { setFormData({ realname: '', phone: '', address: '', detailAddress: '', memo: '' }); }
                }
            }, [isOpen, initialData]);

            const handleSearch = () => {
                try {
                    new window.daum.Postcode({
                        oncomplete: function(data) {
                            let fullAddr = data.address; let extraAddr = '';
                            if(data.addressType === 'R'){
                                if(data.bname !== '') extraAddr += data.bname;
                                if(data.buildingName !== '') extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                                if(extraAddr !== '') fullAddr += ' (' + extraAddr + ')';
                            }
                            setFormData(prev => ({ ...prev, address: fullAddr }));
                            setTimeout(() => detailRef.current?.focus(), 100);
                        }
                    }).open();
                } catch (e) { if (openModal) openModal("주소 검색 오류가 발생했습니다.", "alert"); }
            };

            const handleSubmit = (e) => {
                e.preventDefault(); 
                const notify = (msg) => openModal ? openModal(msg, "alert") : alert(msg);
                if (!formData.realname.trim()) return notify("수령인 이름을 입력해주세요.");
                const cleanPhone = formData.phone.replace(/[^0-9]/g, '');
                if (!cleanPhone) return notify("유효한 연락처(숫자)를 입력해주세요.");
                if (!formData.address.trim()) return notify("배송 주소를 검색하거나 입력해주세요.");
                const finalAddress = `${stripZipcodeFromAddr(formData.address)} ${formData.detailAddress}`.trim();
                onSubmit({ ...formData, zipcode: '', address: finalAddress, phone: cleanPhone, nickname: initialData ? initialData.nickname : nick });
            };

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999] animate-pop">
                    <div className="bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-6 w-full max-w-md mx-4" onClick={e => e.stopPropagation()}>
                        <div className="mb-4 border-b dark:border-slate-700 pb-3 flex justify-between items-center">
                            <h3 className="text-lg font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2"><Icon name="pencil-line" weight="fill" /> '{initialData ? initialData.nickname : nick}' 배송지 {initialData ? '수정' : '빠른 입력'}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><Icon name="x" weight="bold" size={20}/></button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-3">
                            <div className="grid grid-cols-2 gap-3">
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">수령인 이름 (필수)</label><input type="text" value={formData.realname} onChange={e=>setFormData({...formData, realname: e.target.value})} className="w-full border dark:border-slate-600 rounded px-3 py-2 text-sm bg-transparent dark:text-slate-100" placeholder="이름 입력" autoFocus /></div>
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">연락처 (숫자만)</label><input type="text" value={formData.phone} onChange={e=>setFormData({...formData, phone: e.target.value.replace(/[^0-9]/g, '')})} className="w-full border dark:border-slate-600 rounded px-3 py-2 text-sm bg-transparent dark:text-slate-100" placeholder="연락처" /></div>
                            </div>
                            <div>
                                <label className="block text-[10px] font-bold text-slate-500 mb-1">배송 주소 (필수 · 우편번호 생략)</label>
                                <div className="flex gap-2 mb-2">
                                    <input type="text" value={formData.address} onChange={e=>setFormData({...formData, address: e.target.value})} placeholder="주소 검색 또는 직접 입력" className="flex-1 border dark:border-slate-600 rounded px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700 dark:text-slate-100" />
                                    <button type="button" onClick={handleSearch} className="bg-slate-600 text-white px-3 py-2 rounded text-sm font-bold shadow-sm shrink-0">주소 검색</button>
                                </div>
                                <input ref={detailRef} type="text" value={formData.detailAddress} onChange={e=>setFormData({...formData, detailAddress: e.target.value})} placeholder="상세 주소 (동, 호수 등)" className="w-full border dark:border-slate-600 rounded px-3 py-2 text-sm bg-transparent dark:text-slate-100" />
                            </div>
                            <div><label className="block text-[10px] font-bold text-slate-500 mb-1">배송 메모 (선택)</label><input type="text" value={formData.memo} onChange={e=>setFormData({...formData, memo: e.target.value})} className="w-full border dark:border-slate-600 rounded px-3 py-2 text-sm bg-transparent dark:text-slate-100" placeholder="배송 요청사항" /></div>
                            <div className="pt-3 flex gap-2">
                                <button type="button" onClick={onClose} className="flex-1 py-2.5 rounded font-bold text-sm bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">취소</button>
                                <button type="submit" className="flex-1 py-2.5 rounded font-bold text-sm bg-slate-700 text-white">저장 및 즉시 적용</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const SettingsField = ({ label, value, onChange, placeholder, type="text" }) => (
            <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">{label}</label>
                <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-xs bg-slate-50 dark:bg-slate-900 dark:text-white focus:ring-1 focus:ring-slate-400 outline-none" />
            </div>
        );

        const CustomerStatusModal = ({ isOpen, onClose, specialCustomers, setSpecialCustomers, googleScriptUrl, masterSheetId, openModal }) => {
            const [newNick, setNewNick] = useState('');
            const [newStatus, setNewStatus] = useState('vip');
            const [newNoShowCount, setNewNoShowCount] = useState(1);
            const [filterType, setFilterType] = useState('all');
            
            if (!isOpen) return null;

            const syncStatusToSheet = (nick, typeStr) => {
                if (googleScriptUrl && masterSheetId) {
                    fetchGas(googleScriptUrl, {
                        action: 'save_customer_management',
                        masterId: getCleanSheetId(masterSheetId),
                        data: { nickname: nick, type: typeStr }
                    }).catch(() => {});
                }
            };
            
            const handleAdd = async (e) => {
                e.preventDefault();
                if(!newNick.trim()) return;
                const cleanN = newNick.trim();
                const norm = normalizeString(cleanN);
                const currentTime = new Date().toISOString();
                const countVal = newStatus === 'noshow' ? Math.max(1, Number(newNoShowCount) || 1) : 0;
                const sheetTypeStr = newStatus === 'noshow' ? `noshow:${countVal}` : newStatus;
                
                setSpecialCustomers(prev => ({
                    ...prev, 
                    [norm]: {
                        type: newStatus,
                        count: countVal,
                        originalName: cleanN,
                        timestamp: currentTime
                    }
                }));
                
                syncStatusToSheet(cleanN, sheetTypeStr);
                setNewNick('');
                setNewNoShowCount(1);
            };

            const handleAdjustNoShowCount = (key, delta) => {
                setSpecialCustomers(prev => {
                    const cur = prev[key];
                    if (!cur) return prev;
                    const nextCount = Math.max(1, (Number(cur.count) || 1) + delta);
                    const targetNick = cur.originalName || key;
                    syncStatusToSheet(targetNick, `noshow:${nextCount}`);
                    return {
                        ...prev,
                        [key]: { ...cur, type: 'noshow', count: nextCount, timestamp: new Date().toISOString() }
                    };
                });
            };

            const handlePromoteToBlacklist = (key) => {
                const cur = specialCustomers[key];
                if (!cur) return;
                const targetNick = cur.originalName || key;
                openModal(`'${targetNick}' 님을 💀블랙리스트(주문금지)로 전환하시겠습니까?`, 'confirm', () => {
                    setSpecialCustomers(prev => ({
                        ...prev,
                        [key]: { ...prev[key], type: 'blacklist', timestamp: new Date().toISOString() }
                    }));
                    syncStatusToSheet(targetNick, 'blacklist');
                });
            };
            
            const handleRemove = (key) => {
                const targetNick = specialCustomers[key]?.originalName || key;
                setSpecialCustomers(prev => { 
                    const next = {...prev}; 
                    delete next[key]; 
                    return next; 
                });
                syncStatusToSheet(targetNick, '');
            };

            const entriesList = Object.entries(specialCustomers || {}).filter(([_, val]) => {
                if (!val || !val.type) return false;
                if (filterType === 'all') return true;
                return val.type === filterType;
            });
            
            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999] animate-pop">
                    <div className="bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-6 w-full max-w-lg mx-4" onClick={e => e.stopPropagation()}>
                        <div className="mb-3 border-b dark:border-slate-700 pb-3 flex justify-between items-center">
                            <h3 className="text-lg font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2">
                                <Icon name="users-three" weight="fill" className="text-blue-500" /> 통합 고객상태 & 블랙리스트 관리대장
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><Icon name="x" weight="bold" size={20}/></button>
                        </div>

                        <div className="flex gap-1 mb-3 bg-slate-100 dark:bg-slate-900 p-1 rounded-lg text-xs font-bold">
                            {[
                                { id: 'all', label: `전체 (${Object.keys(specialCustomers || {}).length})` },
                                { id: 'blacklist', label: `💀 블랙리스트 (${Object.values(specialCustomers || {}).filter(v => v?.type === 'blacklist').length})` },
                                { id: 'noshow', label: `🚫 노쇼 (${Object.values(specialCustomers || {}).filter(v => v?.type === 'noshow').length})` },
                                { id: 'vip', label: `👑 VIP (${Object.values(specialCustomers || {}).filter(v => v?.type === 'vip').length})` },
                                { id: 'manager', label: `🛡️ 관리자 (${Object.values(specialCustomers || {}).filter(v => v?.type === 'manager').length})` }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    type="button"
                                    onClick={() => setFilterType(tab.id)}
                                    className={`flex-1 py-1.5 rounded text-[11px] transition-colors ${
                                        filterType === tab.id
                                            ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm font-extrabold'
                                            : 'text-slate-500 hover:text-slate-800 dark:hover:text-slate-300'
                                    }`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        <form onSubmit={handleAdd} className="flex gap-1.5 mb-4 items-center">
                            <select 
                                value={newStatus} 
                                onChange={(e) => setNewStatus(e.target.value)}
                                className="border dark:border-slate-600 rounded px-2 py-2 text-xs bg-slate-50 dark:bg-slate-900 dark:text-slate-100 outline-none font-bold shrink-0"
                            >
                                <option value="blacklist">💀 블랙리스트(주문차단)</option>
                                <option value="noshow">🚫 노쇼(횟수관리)</option>
                                <option value="vip">👑 VIP(무료배송)</option>
                                <option value="manager">🛡️ 관리자</option>
                            </select>
                            {newStatus === 'noshow' && (
                                <div className="flex items-center border dark:border-slate-600 rounded px-1.5 py-1.5 bg-slate-50 dark:bg-slate-900 shrink-0">
                                    <input
                                        type="number"
                                        min="1"
                                        max="99"
                                        value={newNoShowCount}
                                        onChange={e => setNewNoShowCount(e.target.value)}
                                        className="w-8 text-center text-xs font-extrabold bg-transparent outline-none dark:text-white"
                                    />
                                    <span className="text-[11px] font-bold text-slate-500">회</span>
                                </div>
                            )}
                            <input type="text" value={newNick} onChange={e=>setNewNick(e.target.value)} placeholder="닉네임 입력" className="flex-1 min-w-0 border dark:border-slate-600 rounded px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 dark:text-slate-100 outline-none font-bold" autoFocus />
                            <button type="submit" className="bg-slate-800 text-white px-3.5 py-2 rounded text-xs font-bold whitespace-nowrap shadow-sm hover:bg-slate-900 shrink-0">등록</button>
                        </form>
                        <div className="max-h-80 overflow-y-auto space-y-1.5 pr-1">
                            {entriesList.map(([key, val]) => {
                                let statusIcon = <Icon name="crown" weight="fill" className="text-amber-500 mr-1" />;
                                let statusLabel = "VIP";
                                let bgClass = "bg-amber-50 dark:bg-amber-900/10 border-amber-200 dark:border-amber-800/40";
                                const nsCount = Math.max(1, Number(val.count) || 1);
                                
                                if (val.type === 'blacklist') {
                                    statusIcon = <Icon name="skull" weight="fill" className="text-red-500 mr-1" />;
                                    statusLabel = "블랙리스트";
                                    bgClass = "bg-slate-900 text-white border-red-600 ring-1 ring-red-500";
                                } else if (val.type === 'noshow') {
                                    statusIcon = <Icon name="user-minus" weight="fill" className="text-red-500 mr-1" />;
                                    statusLabel = `노쇼 ${nsCount}회`;
                                    bgClass = "bg-red-50 dark:bg-red-900/10 border-red-200 dark:border-red-800/40";
                                } else if (val.type === 'manager') {
                                    statusIcon = <Icon name="shield-check" weight="fill" className="text-blue-500 mr-1" />;
                                    statusLabel = "관리자";
                                    bgClass = "bg-blue-50 dark:bg-blue-900/10 border-blue-200 dark:border-blue-800/40";
                                }

                                return (
                                    <div key={key} className={`flex justify-between items-center ${bgClass} p-2 rounded border`}>
                                        <div className="flex flex-col min-w-0 pr-2">
                                            <div className="flex items-center flex-wrap gap-1">
                                                <span className={`text-[10px] font-extrabold px-1.5 py-0.5 rounded shadow-sm flex items-center ${
                                                    val.type === 'blacklist'
                                                        ? 'bg-red-600 text-white'
                                                        : 'bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 border dark:border-slate-600'
                                                }`}>
                                                    {statusIcon} {statusLabel}
                                                </span>
                                                <span className={`font-extrabold text-sm truncate ${val.type === 'blacklist' ? 'text-red-200' : 'text-slate-800 dark:text-slate-200'}`}>
                                                    {val.originalName || key}
                                                </span>
                                            </div>
                                            {val.timestamp && <span className="text-[9px] text-slate-400 mt-0.5 pl-1">{formatTimeOnly(val.timestamp)} 등록</span>}
                                        </div>
                                        <div className="flex items-center gap-1 shrink-0">
                                            {val.type === 'noshow' && (
                                                <>
                                                    <button
                                                        type="button"
                                                        onClick={() => handleAdjustNoShowCount(key, -1)}
                                                        className="w-6 h-6 rounded bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 font-black text-xs hover:bg-slate-100"
                                                        title="노쇼 횟수 -1 감소"
                                                    >
                                                        -
                                                    </button>
                                                    <span className="text-xs font-black text-red-600 dark:text-red-400 px-1 tabular-nums">{nsCount}회</span>
                                                    <button
                                                        type="button"
                                                        onClick={() => handleAdjustNoShowCount(key, 1)}
                                                        className="w-6 h-6 rounded bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-red-600 font-black text-xs hover:bg-red-50"
                                                        title="노쇼 횟수 +1 증가"
                                                    >
                                                        +
                                                    </button>
                                                    <button
                                                        type="button"
                                                        onClick={() => handlePromoteToBlacklist(key)}
                                                        className="px-1.5 py-1 bg-slate-900 hover:bg-black text-amber-300 rounded text-[10px] font-extrabold ml-0.5"
                                                        title="이 노쇼 고객을 블랙리스트로 전환"
                                                    >
                                                        💀블랙전환
                                                    </button>
                                                </>
                                            )}
                                            <button onClick={()=>handleRemove(key)} className="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1 bg-white dark:bg-slate-800 rounded transition-colors shadow-sm shrink-0 border border-red-100 dark:border-red-900/30">해제</button>
                                        </div>
                                    </div>
                                );
                            })}
                            {entriesList.length === 0 && <div className="text-center text-slate-500 text-sm py-8 bg-slate-50 dark:bg-slate-800/50 rounded border border-dashed dark:border-slate-600">등록된 고객상태가 없습니다.</div>}
                        </div>
                    </div>
                </div>
            );
        };

        const SettingsModalContent = ({ 
            googleScriptUrl, setGoogleScriptUrl, 
            youtubeApiKey, setYoutubeApiKey, youtubeVideoId, setYoutubeVideoId,
            depSheetId, setDepSheetId, addrSheetId, setAddrSheetId, masterSheetId, setMasterSheetId, 
            broadcastName, setBroadcastName,
            quickShipping, setQuickShipping, jejuShipping, setJejuShipping, freeShippingThreshold, setFreeShippingThreshold, cardFeeRate, setCardFeeRate,
            templateConfig, setTemplateConfig, bankAccount, setBankAccount, quickMessages, setQuickMessages, 
            addressStartDate, setAddressStartDate, soundVolume, setSoundVolume,
            staffAccessPasscode, setStaffAccessPasscode,
            setIsSettingsOpen
        }) => {
            return (
                <div className="absolute top-12 right-4 bg-white dark:bg-slate-800 shadow-xl border dark:border-slate-700 rounded-lg p-4 w-[420px] z-50 animate-pop max-h-[85vh] overflow-y-auto">
                    <h3 className="font-bold mb-4 flex items-center gap-2 border-b dark:border-slate-700 pb-2"><Icon name="gear" weight="fill" className="text-gray-500"/> 환경설정</h3>
                    <div className="mb-4 space-y-4">
                        <div className="p-3 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-lg space-y-2">
                            <SettingsField label="💡 방송명 (엑셀 제목용)" value={broadcastName} onChange={setBroadcastName} placeholder="예: 5월24일 오전방송" />
                        </div>

                        <div className="p-3 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 rounded-lg space-y-1.5">
                            <SettingsField label="🔒 직원용 시스템 접속 비밀번호 (퇴사자 차단용)" value={staffAccessPasscode} onChange={setStaffAccessPasscode} placeholder="예: 1234 (변경 시 직원 화면 즉시 잠금)" />
                            <p className="text-[10px] text-emerald-700 dark:text-emerald-300 font-bold leading-snug">
                                * 직원이 퇴사/이직했을 때 여기서 비밀번호만 바꾸면 주소를 안 바꿔도 즉시 접속이 차단됩니다!
                            </p>
                        </div>
                        
                        <div className="p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg space-y-2">
                            <h4 className="text-sm font-bold text-red-600 dark:text-red-400 mb-2 flex items-center gap-1"><Icon name="youtube-logo" weight="fill"/> YouTube 채팅 연동</h4>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">[필수] 유튜브 API 키 (여러 개는 줄바꿈/쉼표 구분)</label>
                                <textarea value={youtubeApiKey} onChange={(e) => setYoutubeApiKey(e.target.value)} placeholder="AIzaSy...\nAIzaSy..." className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-xs bg-slate-50 dark:bg-slate-900 dark:text-white focus:ring-1 focus:ring-slate-400 outline-none h-16 resize-y"></textarea>
                            </div>
                            <SettingsField label="유튜브 라이브 영상 주소 (URL 전체 붙여넣기)" value={youtubeVideoId} onChange={(val) => setYoutubeVideoId(extractYoutubeId(val))} placeholder="예: https://youtube.com/live/abcd..." />
                        </div>

                        <SettingsField label="[필수] 통합 앱스 스크립트 URL (기타 데이터 연동용)" value={googleScriptUrl} onChange={setGoogleScriptUrl} placeholder="배포된 웹앱 URL 복사/붙여넣기" />
                        
                        <div className="p-3 bg-slate-100 dark:bg-slate-700/50 rounded-lg space-y-2 border border-slate-300 dark:border-slate-600">
                            <SettingsField label="[읽기] 입금 시트 ID" value={depSheetId} onChange={setDepSheetId} placeholder="시트 주소의 /d/ 뒷부분" />
                        </div>
                        
                        <div className="p-3 bg-amber-50 dark:bg-amber-900/20 rounded-lg space-y-2 border border-amber-200 dark:border-amber-800">
                            <SettingsField label="[쓰기] 스마트오더 마스터 시트 ID (주문서/찐고객사전 통합)" value={masterSheetId} onChange={setMasterSheetId} placeholder="새로 만든 백업 시트 ID" />
                        </div>
                        
                        <div className="border-t dark:border-slate-700 pt-4">
                            <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">배송비 및 카드 수수료 설정</label>
                            <div className="grid grid-cols-4 gap-2 mb-2">
                                <SettingsField label="기본 배송비" type="number" value={quickShipping} onChange={(v) => setQuickShipping(Number(v))} />
                                <SettingsField label="제주 총배송비" type="number" value={jejuShipping} onChange={(v) => setJejuShipping(Number(v))} placeholder="예: 7000" />
                                <SettingsField label="무료 기준" type="number" value={freeShippingThreshold} onChange={(v) => setFreeShippingThreshold(v)} placeholder="예: 70000" />
                                <SettingsField label="카드수수료(%)" type="number" value={cardFeeRate} onChange={(v) => setCardFeeRate(v === '' ? '' : Number(v))} placeholder="10" />
                            </div>
                        </div>
                        
                        <div className="border-t dark:border-slate-700 pt-4">
                            <h4 className="text-sm font-bold text-slate-800 dark:text-slate-200 mb-2 flex items-center gap-1"><Icon name="chat-text" weight="fill"/> 주문서 멘트 설정</h4>
                            <div className="space-y-3">
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-500 mb-1">닉네임 이모지</label>
                                    <input type="text" value={templateConfig.emoji} onChange={(e)=>setTemplateConfig(p => ({...p, emoji: e.target.value}))} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-sm bg-slate-50 dark:bg-slate-900 dark:text-white mb-2 outline-none" />
                                    <div className="flex flex-wrap gap-1 bg-slate-50 dark:bg-slate-900 p-2 rounded border dark:border-slate-700 max-h-32 overflow-y-auto">
                                        {EMOJI_LIST.map(em => (<button type="button" key={em} onClick={() => setTemplateConfig(p => ({...p, emoji: em}))} className="w-7 h-7 flex items-center justify-center hover:bg-white dark:hover:bg-slate-700 rounded transition-all text-base">{em}</button>))}
                                    </div>
                                </div>
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">완납 메시지</label><input type="text" value={templateConfig.paidMsg} onChange={(e)=>setTemplateConfig(p => ({...p, paidMsg: e.target.value}))} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-sm bg-slate-50 dark:bg-slate-900 dark:text-white outline-none" /></div>
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">미납 안내</label><textarea value={templateConfig.unpaidPrefix} onChange={(e)=>setTemplateConfig(p => ({...p, unpaidPrefix: e.target.value}))} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-xs h-16 resize-none bg-slate-50 dark:bg-slate-900 dark:text-white outline-none" /></div>
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">과납 안내</label><textarea value={templateConfig.overpaidMsg} onChange={(e)=>setTemplateConfig(p => ({...p, overpaidMsg: e.target.value}))} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-xs h-12 resize-none bg-slate-50 dark:bg-slate-900 dark:text-white outline-none" /></div>
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">계좌번호</label><textarea value={bankAccount} onChange={(e)=>setBankAccount(e.target.value)} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-xs h-12 resize-none bg-slate-50 dark:bg-slate-900 dark:text-white outline-none" /></div>
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">주소 있음 안내</label><textarea value={templateConfig.addrNotice} onChange={(e)=>setTemplateConfig(p => ({...p, addrNotice: e.target.value}))} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-xs h-12 resize-none bg-slate-50 dark:bg-slate-900 dark:text-white outline-none" /></div>
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">주소 없음 안내</label><textarea value={templateConfig.surveyNotice} onChange={(e)=>setTemplateConfig(p => ({...p, surveyNotice: e.target.value}))} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-xs h-24 resize-none bg-slate-50 dark:bg-slate-900 dark:text-white outline-none" /></div>
                                <div className="flex items-center justify-between bg-slate-100 dark:bg-slate-800 p-2 rounded border dark:border-slate-600">
                                    <label className="text-xs font-bold text-slate-700 dark:text-slate-300 cursor-pointer" onClick={() => setTemplateConfig(p => ({...p, alwaysRequestAddress: !p.alwaysRequestAddress}))}>주소록 무시하고 항상 새로 입력받기</label>
                                    <input type="checkbox" checked={templateConfig.alwaysRequestAddress || false} onChange={(e)=>setTemplateConfig(p => ({...p, alwaysRequestAddress: e.target.checked}))} className="custom-checkbox" />
                                </div>
                            </div>
                        </div>
                        <div className="border-t dark:border-slate-700 pt-4">
                            <h4 className="text-sm font-bold text-slate-800 dark:text-slate-200 mb-2 flex items-center gap-1"><Icon name="lightning" weight="fill" className="text-slate-500"/> 빠른 댓글 설정</h4>
                            <div className="space-y-2">
                                {quickMessages.map((msg, idx) => (
                                    <input key={idx} type="text" value={msg} onChange={(e) => { const v = e.target.value; setQuickMessages(prev => { const next = [...prev]; next[idx] = v; return next; }); }} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-xs bg-slate-50 dark:bg-slate-900 dark:text-white outline-none" />
                                ))}
                            </div>
                        </div>

                        <div className="border-t dark:border-slate-700 pt-4 mt-4">
                            <h4 className="text-sm font-bold text-slate-800 dark:text-slate-200 mb-2 flex items-center gap-1"><Icon name="sliders" weight="fill" className="text-slate-500"/> 편의 기능 설정</h4>
                            <div className="space-y-3">
                                <SettingsField type="date" label="주소록 수집 시작일 (지정일 이전 수집건 무시)" value={addressStartDate} onChange={setAddressStartDate} />
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">알림음 볼륨 ({soundVolume}%)</label>
                                    <input type="range" min="0" max="100" value={soundVolume} onChange={e => setSoundVolume(Number(e.target.value))} className="w-full accent-slate-600 cursor-pointer" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const InventoryItemRow = memo(({ item, itemStats, expandedInventoryItem, isPinned, onItemAction, setInventory, setOrders, setProductHistory, saveInventoryToServer, openModal, customerPaidStatus, cardPayments, setExpandedInventoryItem }) => {
            const isBuyerListOpen = item && expandedInventoryItem === item.name;
            const [isEditing, setIsEditing] = useState(false);
            const orderedCount = itemStats ? itemStats.count : 0;
            const waitlistCount = itemStats ? (itemStats.waitlistCount || 0) : 0;
            const aggregatedOrders = (itemStats && itemStats.aggregated) ? itemStats.aggregated : [];
            const waitlistAggregated = (itemStats && itemStats.waitlistAggregated) ? itemStats.waitlistAggregated : [];
            const [feedback, setFeedback] = useState(null);

            const [localName, setLocalName] = useState(item?.name || '');
            const [localPrice, setLocalPrice] = useState(item?.price === 0 || item?.price === '' ? '' : Number(item?.price).toLocaleString());
            const [localStock, setLocalStock] = useState(item?.stock === undefined || item?.stock === '' ? '' : item?.stock);

            useEffect(() => {
                // ✨ 수정창을 열어두고 타이핑 중일 때는 외부 리렌더링이 입력 중인 글자를 덮어쓰지 않도록 완벽 차단
                if (item && !isEditing) {
                    setLocalName(item.name);
                    setLocalPrice(item.price === 0 || item?.price === '' ? '' : Number(item.price).toLocaleString());
                    setLocalStock(item.stock === undefined || item.stock === '' ? '' : item?.stock);
                }
            }, [item, isEditing]);

            const hasStockLimit = item && item.stock !== '' && item.stock !== undefined && item.stock !== null;
            const totalStock = hasStockLimit ? Number(item.stock) : null;
            const remainingStock = hasStockLimit ? Math.max(0, totalStock - orderedCount) : '∞';

            const handleClick = (e) => {
                e.stopPropagation();
                if (onItemAction && item) {
                    const res = onItemAction(item, e.detail);
                    if (res) {
                        setFeedback(res);
                        setTimeout(() => setFeedback(null), 1000);
                    }
                }
            };

            const handlePinClick = (e) => {
                e.stopPropagation();
                if (onItemAction && item) {
                    const res = onItemAction(item, 'pin');
                    if (res) {
                        setFeedback(res);
                        setTimeout(() => setFeedback(null), 1000);
                    }
                }
            };

            const handleSave = (e) => {
                if (e) e.stopPropagation();
                if (!item) return;
                const newName = localName.trim();
                const newPrice = Number(String(localPrice).replace(/,/g, ''));
                const newStock = localStock === '' ? '' : parseInt(localStock);
                if (!newName) return openModal('상품명을 입력해주세요.', 'alert');

                let isDuplicate = false;
                setInventory(prevInv => {
                    if (newName !== item.name && prevInv.some(i => i.name === newName && i.name !== item.name)) {
                        isDuplicate = true;
                        return prevInv;
                    }
                    const newInv = prevInv.map(i => i.name === item.name ? { ...i, name: newName, price: newPrice, stock: newStock } : i);
                    saveInventoryToServer(newInv);
                    return newInv;
                });

                if (isDuplicate) {
                    openModal('이미 동일한 이름의 상품이 있습니다.', 'alert');
                    setLocalName(item.name);
                    return;
                }

                // ✨ 실시간 재고에서 상품명이나 단가(금액)를 수정하면, 이미 구매한 고객들의 주문서 상품명과 금액(수량×새 단가)도 즉시 일괄 변경!
                const isNameChanged = newName !== item.name;
                const isPriceChanged = newPrice !== Number(item.price);

                if (isNameChanged || isPriceChanged) {
                    const isDiscount = newName === '적립금';
                    const unitPriceToApply = (isDiscount && newPrice > 0) ? -Math.abs(newPrice) : newPrice;

                    setOrders(prevOrders => prevOrders.map(o => {
                        if (o.product === item.name) {
                            const qty = (o.quantity === '' || o.quantity === undefined || o.quantity === null) ? 1 : Number(o.quantity);
                            return {
                                ...o,
                                product: newName,
                                price: isPriceChanged ? (unitPriceToApply * qty) : o.price
                            };
                        }
                        return o;
                    }));

                    setProductHistory(prevHist => {
                        const next = { ...prevHist };
                        if (isNameChanged && next[item.name] !== undefined) {
                            delete next[item.name];
                        }
                        if (newPrice > 0) {
                            next[newName] = newPrice;
                        }
                        return next;
                    });

                    if (isNameChanged && isBuyerListOpen) {
                        setExpandedInventoryItem(newName);
                    }
                }
                setIsEditing(false);
            };

            const handleToggleSoldOut = (e) => {
                e.stopPropagation();
                setInventory(prev => { const newInv = prev.map(i => i.name === item.name ? { ...i, isSoldOut: !i.isSoldOut } : i); saveInventoryToServer(newInv); return newInv; });
            };

            const handleToggleLock = (e) => {
                e.stopPropagation();
                setInventory(prev => { const newInv = prev.map(i => i.name === item.name ? { ...i, isSoldOut: i.isSoldOut, isLocked: !i.isLocked } : i); saveInventoryToServer(newInv); return newInv; });
            };

            const handleDelete = (e) => {
                e.stopPropagation();
                if (item.isLocked) return openModal('잠금(자물쇠)이 설정된 상품은 삭제할 수 없습니다.', 'alert');
                openModal(`'${item.name}' 상품을 삭제하시겠습니까?`, 'confirm', () => {
                    setInventory(prev => {
                        const newInv = prev.filter(i => i.name !== item.name);
                        saveInventoryToServer(newInv);
                        return newInv;
                    });
                    if (isBuyerListOpen) {
                        setExpandedInventoryItem(null);
                    }
                });
            };

            const handleCopyNames = (e) => {
                e.stopPropagation();
                if (!item || aggregatedOrders.length === 0) return;
                const title = `🔹 ${item.name} (총 ${orderedCount}개)\n`;
                const names = aggregatedOrders.map(a => a.quantity > 1 ? `${a.customer}(${a.quantity})` : a.customer).join(', ');
                const text = title + names;
                const textArea = document.createElement("textarea"); textArea.value = text; document.body.appendChild(textArea); textArea.select();
                try { document.execCommand('copy'); openModal('명단이 복사되었습니다.', 'alert'); } catch (err) {} document.body.removeChild(textArea);
            };

            if (!item) return null;

            return (
                <div className={`border-b border-slate-200 dark:border-slate-700/80 transition-colors select-none py-1.5 px-2 ${isPinned ? 'bg-purple-50/60 dark:bg-purple-900/20' : 'bg-white dark:bg-slate-800 hover:bg-slate-50/70 dark:hover:bg-slate-700/40'}`}>
                    {}
                    {/* 1번째 줄: 다른 패널과 자연스럽게 어울리는 12px 굵기 상품명 */}
                    <div className="flex items-center justify-between gap-1.5">
                        <div className="flex items-center gap-1.5 flex-1 min-w-0">
                            <button type="button" onClick={handlePinClick} className={`p-0.5 rounded transition-colors shrink-0 ${isPinned ? 'text-purple-600 dark:text-purple-400 font-bold' : 'text-slate-300 hover:text-purple-600'}`} title={isPinned ? "고정 해제" : "클릭하여 이 상품 즉시 고정"}>
                                <Icon name="push-pin" weight={isPinned ? "fill" : "regular"} size={13} />
                            </button>
                            <div onClick={handleClick} className="flex-1 min-w-0 cursor-pointer group" title="1클릭: 상품명 복사 / 2클릭: 상품 고정 / 3클릭: 메뉴 텍스트 복사">
                                <span className={`font-bold text-[12px] truncate block leading-snug ${item.isSoldOut ? 'text-slate-400 line-through dark:text-slate-500 font-normal' : (isPinned ? 'text-purple-700 dark:text-purple-300' : 'text-slate-800 dark:text-slate-200 group-hover:text-blue-600 dark:group-hover:text-blue-400')}`}>
                                    {feedback ? <span className={feedback.color}>{feedback.msg}</span> : item.name}
                                </span>
                            </div>
                        </div>
                        <button onClick={handleToggleSoldOut} className={`px-1.5 py-0.5 rounded text-[10px] font-bold leading-none shrink-0 transition-colors ${item.isSoldOut ? 'bg-red-500 text-white hover:bg-red-600' : 'bg-slate-100 text-slate-400 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-400 dark:hover:bg-slate-600'}`}>
                            품절
                        </button>
                    </div>

                    {/* 2번째 줄: 배경색이나 박스 없이 깔끔하게 들여쓰기된 부가 정보 */}
                    <div className="mt-0.5 pl-5 flex items-center justify-between gap-1 text-[11px] leading-none">
                        <div onClick={handleClick} className="flex items-center gap-1.5 text-slate-400 dark:text-slate-500 min-w-0 cursor-pointer">
                            <span className="text-slate-500 dark:text-slate-400 font-medium tabular-nums">{item.price ? Number(item.price).toLocaleString() : '0'}</span>
                            <span className="text-slate-200 dark:text-slate-700">|</span>
                            <span>잔여 <strong className={`font-bold tabular-nums ${!hasStockLimit ? 'text-blue-500 dark:text-blue-400' : (remainingStock > 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-500')}`}>{remainingStock}</strong></span>
                            <span className="text-slate-200 dark:text-slate-700">|</span>
                            <span>주문 <strong className={`font-bold tabular-nums ${orderedCount > 0 ? 'text-blue-600 dark:text-blue-400' : 'text-slate-400 dark:text-slate-500'}`}>{orderedCount}</strong>{waitlistCount > 0 && <strong className="text-orange-500 font-bold ml-0.5">(+{waitlistCount})</strong>}</span>
                        </div>

                        <div className="flex items-center gap-1 shrink-0 text-slate-400">
                            <button onClick={handleToggleLock} className={`p-0.5 rounded hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors ${item.isLocked ? 'text-amber-500' : 'text-slate-300 hover:text-slate-600 dark:hover:text-slate-200'}`} title={item.isLocked ? "잠금 해제" : "초기화 방지 잠금"}>
                                <Icon name={item.isLocked ? "lock-key" : "lock-simple"} weight={item.isLocked ? "fill" : "regular"} size={12} />
                            </button>
                            <button onClick={(e) => { e.stopPropagation(); setIsEditing(prev => !prev); }} className={`p-0.5 rounded hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors ${isEditing ? 'text-blue-600' : 'text-slate-300 hover:text-slate-600 dark:hover:text-slate-200'}`} title="상품 정보 수정">
                                <Icon name="pencil-simple" weight={isEditing ? "fill" : "regular"} size={12} />
                            </button>
                            <button onClick={handleDelete} className={`p-0.5 rounded hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors ${item.isLocked ? 'text-slate-200 dark:text-slate-700 cursor-not-allowed' : 'text-slate-300 hover:text-red-500'}`} title="상품 삭제">
                                <Icon name="trash" weight="regular" size={12} />
                            </button>
                            <button onClick={(e) => { e.stopPropagation(); setExpandedInventoryItem(prev => prev === item.name ? null : item.name); }} className={`ml-0.5 px-1 py-0.5 flex items-center justify-center rounded transition-colors ${isBuyerListOpen || orderedCount > 0 || waitlistCount > 0 ? 'text-blue-600 dark:text-blue-400 font-bold' : 'text-slate-300 hover:text-slate-600'}`} title="구매자 명단 접기/펴기">
                                <Icon name={isBuyerListOpen ? "caret-up" : "caret-down"} weight="bold" size={11} />
                            </button>
                        </div>
                    </div>

                    {/* ✏️ 연필 아이콘 클릭 시에만 열리는 인라인 상품 수정창 */}
                    {isEditing && (
                        <div onClick={e => e.stopPropagation()} className="mt-1.5 pt-1.5 border-t border-dashed border-slate-200 dark:border-slate-700 flex flex-col gap-1 text-[10px]">
                            <input type="text" value={localName} onChange={e=>setLocalName(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')handleSave(e); if(e.key==='Escape')setIsEditing(false);}} className="w-full border border-blue-300 dark:border-blue-700 bg-white dark:bg-slate-800 dark:text-white px-1.5 py-0.5 rounded text-[11px] outline-none focus:ring-1 focus:ring-blue-500 font-bold" placeholder="상품명" autoFocus />
                            <div className="flex items-center gap-1">
                                <div className="flex items-center flex-1 border border-blue-300 dark:border-blue-700 bg-white dark:bg-slate-800 rounded overflow-hidden">
                                    <span className="px-1 text-[9px] text-slate-500 bg-slate-50 dark:bg-slate-700 h-full flex items-center shrink-0">단가</span>
                                    <input type="text" value={localPrice} onChange={e=>{const v = e.target.value.replace(/,/g, ''); if (v === '' || v === '-') setLocalPrice(v); else if(!isNaN(v)) setLocalPrice(Number(v).toLocaleString());}} onKeyDown={e=>{if(e.key==='Enter')handleSave(e); if(e.key==='Escape')setIsEditing(false);}} className="w-full bg-transparent dark:text-white px-1 py-0.5 text-[10px] text-right outline-none font-bold" placeholder="0" />
                                </div>
                                <div className="flex items-center w-16 border border-blue-300 dark:border-blue-700 bg-white dark:bg-slate-800 rounded overflow-hidden shrink-0">
                                    <span className="px-1 text-[9px] text-slate-500 bg-slate-50 dark:bg-slate-700 h-full flex items-center shrink-0">재고</span>
                                    <input type="number" value={localStock} onChange={e=>setLocalStock(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')handleSave(e); if(e.key==='Escape')setIsEditing(false);}} className="w-full bg-transparent dark:text-white px-1 py-0.5 text-[10px] text-right outline-none font-bold" placeholder="∞" />
                                </div>
                                <button onClick={handleSave} className="bg-blue-600 hover:bg-blue-700 text-white px-2 py-0.5 rounded text-[10px] font-bold shrink-0">저장</button>
                            </div>

                // 2) 구글 시트('찐고객사전')에 덮어쓰기 저장 (forceOverwrite: true로 연락처가 바뀌었더라도 옛날 줄을 찾아 확실히 수정!)

            const addressLookup = useMemo(() => {
                const exactNickMap = {};

                addresses.forEach((a, idx) => {
                    const cleanNick = normalizeString(a.nickname);
                    const handleNick = normalizeHandleNick(a.nickname);
                    if (!cleanNick) return;

                    const enriched = { ...a, _rowOrder: idx };
                    if (!exactNickMap[cleanNick]) exactNickMap[cleanNick] = [];
                    exactNickMap[cleanNick].push(enriched);

                    if (handleNick) {
                        if (!handleNickMap[handleNick]) handleNickMap[handleNick] = [];

                });

                const pickLatestAddr = (list, pinHint = '') => {
                    if (!list || list.length === 0) return null;
                    if (pinHint) {
                        const cleanPin = String(pinHint).replace(/[^0-9]/g, '').slice(-4);
                        if (cleanPin) {
                            const pinFiltered = list.filter(item => fixPhoneNumber(item.phone).slice(-4) === cleanPin);
